name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-scripts:
    name: Web Build, Unit Tests & Hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages & desktop web
        run: |
          pnpm build:packages
          pnpm --filter @gsat/desktop build

      - name: Run frontend Vitest suite
        run: pnpm --filter @gsat/desktop test

      - name: Run desktop & tooling script tests
        run: |
          node --test apps/desktop/scripts/normalize-updater-manifest.test.mjs
          python3 -m unittest discover -s tools/cards -p '*_test.py'

      - name: Check docs hygiene (no local home paths or secrets)
        run: |
          if git grep -nE '/Users/|/home/|100\.70\.139\.102|FoxM3MAX' -- \
            README.md CONTRIBUTING.md SECURITY.md AGENTS.md CLAUDE.md \
            .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS \
            docs/README.md docs/PRODUCT.md docs/ARCHITECTURE.md \
            docs/ROADMAP.md docs/HANDOFF.md docs/CI_GUIDE.md docs/archive/README.md \
            docs/rebuild/README.md docs/releases/v2.1.0-fox.1.md; then
            echo "发现本机路径或内部地址泄露，请清理后再提交。" >&2
            exit 1
          fi

  rust-fmt:
    name: Rust Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check cargo fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  rust-test:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies & build frontend context
        run: |
          pnpm install --frozen-lockfile
          pnpm build:packages
          pnpm --filter @gsat/desktop build
          node apps/desktop/scripts/prepare-native-runtime.mjs --bootstrap --target x86_64-unknown-linux-gnu

      - name: Run cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run cargo test (--lib)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --skip auth::tests::macos_secure_store_initializes_keychain_before_entry_creation

  ui-acceptance:
    name: UI Browser Acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies & build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:packages
          pnpm --filter @gsat/desktop build

      - name: Install Playwright & Chromium in isolated directory
        run: |
          mkdir -p /tmp/pw-ci
          npm --prefix /tmp/pw-ci install --no-save playwright
          /tmp/pw-ci/node_modules/.bin/playwright install --with-deps chromium

      - name: Run isolated browser acceptance
        env:
          FSL_PLAYWRIGHT_PATH: /tmp/pw-ci/node_modules/playwright
          FSL_ACCEPTANCE_OUT: acceptance-out
        run: node tools/dev-ui/acceptance.mjs

      - name: Upload UI acceptance report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance-failure
          path: acceptance-out/
