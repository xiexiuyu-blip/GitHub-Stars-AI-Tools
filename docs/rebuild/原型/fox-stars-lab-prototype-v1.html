<title>Fox Stars Lab 2.0 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.49.0/dist/umd/lucide.min.js"></script>
<style>
/* 布局：中文办公风（飞书式），与微信工作台同一套令牌。顶栏 46 + 图标导航 72 + 灰色画布上的白色卡片。
   只用品牌蓝 + 提醒红；字号 12/14/16/20/28 五档；每屏最多一个蓝色实底主按钮。 */
:root{
  --desk:#E6E7E9; --bg:#F2F3F5; --card:#FFFFFF; --line:#E4E5E7; --line-2:#EFF0F1; --line-strong:#D0D3D6;
  --hover:#F5F6F7; --sel:#F0F4FF; --gray-soft:#EFF0F1;
  --text:#1F2329; --text-2:#646A73; --text-3:#8F959E;
  --brand:#2E6BF0; --brand-hover:#2558D8; --brand-soft:#E1EAFF; --brand-text:#245BDB;
  --red:#D83931; --red-soft:#FDE2E2; --red-text:#C02A26; --ok:#34C724;
  --pop:0 8px 28px rgba(31,35,41,.14),0 0 0 1px rgba(31,35,41,.06);
  --win:0 0 0 1px rgba(31,35,41,.08),0 20px 50px rgba(31,35,41,.12);
  --scrim:rgba(31,35,41,.38);
  --font:"PingFang SC","Noto Sans SC",-apple-system,"Inter",system-ui,sans-serif;
  --num:"Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0B0B0C; --bg:#161617; --card:#1F1F21; --line:#2E2E31; --line-2:#28282B; --line-strong:#3A3A3E;
  --hover:#262629; --sel:#1C2840; --gray-soft:#2A2A2D;
  --text:#EBEBEC; --text-2:#A6A7AB; --text-3:#7C7D82;
  --brand:#4C88FF; --brand-hover:#6C9DFF; --brand-soft:rgba(76,136,255,.18); --brand-text:#8DB2FF;
  --red:#F76964; --red-soft:rgba(247,105,100,.16); --red-text:#FF8F8A; --ok:#3FD15A;
  --pop:0 10px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
  --win:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#0B0B0C; --bg:#161617; --card:#1F1F21; --line:#2E2E31; --line-2:#28282B; --line-strong:#3A3A3E;
  --hover:#262629; --sel:#1C2840; --gray-soft:#2A2A2D;
  --text:#EBEBEC; --text-2:#A6A7AB; --text-3:#7C7D82;
  --brand:#4C88FF; --brand-hover:#6C9DFF; --brand-soft:rgba(76,136,255,.18); --brand-text:#8DB2FF;
  --red:#F76964; --red-soft:rgba(247,105,100,.16); --red-text:#FF8F8A; --ok:#3FD15A;
  --pop:0 10px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
  --win:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
[data-lucide],.lucide{width:16px;height:16px;flex:none;stroke-width:1.8}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:6px}
.t2{color:var(--text-2)} .t3{color:var(--text-3)} .sp{flex:1}
kbd{font:500 11px/16px var(--num);color:var(--text-3);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;background:var(--card);white-space:nowrap}

/* 原型条（不属于产品） */
.pbar{max-width:1560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.pbar b{color:var(--text);font-weight:600;font-size:14px}
.pbar .sp{min-width:8px}

/* 窗口 */
.app{max-width:1560px;width:100%;margin:0 auto;min-height:0;display:grid;grid-template-rows:46px minmax(0,1fr);background:var(--bg);border-radius:12px;box-shadow:var(--win);overflow:hidden;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;background:var(--card);border-bottom:1px solid var(--line);min-width:0}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;margin-left:6px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#FFFFFF;font:600 12px/22px var(--font);text-align:center;font-style:normal;display:block}
.q{margin:0 auto;width:min(460px,42%);min-width:0;height:30px;border-radius:6px;background:var(--bg);color:var(--text-3);font-size:14px;display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left}
.q:hover{background:var(--gray-soft)}
.q span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:4px;flex:none}
.sync{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-right:2px}
.sync b{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.sync b.spin{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.uav{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#FFFFFF;font:600 12px/28px var(--num);text-align:center;margin-left:6px}
.body{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:0}
.rail{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;min-height:0;overflow:auto}
.ri{position:relative;width:58px;padding:7px 0 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--text-2)}
.ri [data-lucide],.ri .lucide{width:20px;height:20px;stroke-width:1.7}
.ri:hover{background:var(--hover);color:var(--text)}
.ri.on{background:var(--brand-soft);color:var(--brand-text)}
.ri .badge{position:absolute;top:2px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#FFFFFF;font:600 11px/16px var(--num);padding:0 4px;text-align:center}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* 通用 */
.canvas{flex:1;min-height:0;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.canvas.fixed{overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:0}
.cardp{padding:16px}
.card-h{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-bottom:1px solid var(--line-2);flex:none}
.card-h h3{margin:0;font-size:16px;font-weight:600;white-space:nowrap}
.cnt{font:500 12px var(--num);color:var(--text-3)}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;flex:none}
.phead h1,.greet h1{margin:0;font-size:20px;font-weight:600;line-height:1.4}
.phead p,.greet p{margin:0 0 2px;font-size:14px;color:var(--text-2)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:6px;font-size:14px;border:1px solid var(--line-strong);background:var(--card);color:var(--text);white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.btn.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.text{border-color:transparent;background:transparent;color:var(--brand-text);padding:0 4px;height:28px}
.btn.text:hover{background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.sm{height:28px;padding:0 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:32px;height:32px;border-radius:6px;display:inline-grid;place-items:center;color:var(--text-2);flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:4px;font-size:12px;background:var(--gray-soft);color:var(--text-2);white-space:nowrap;flex:none}
.tag [data-lucide],.tag .lucide{width:12px;height:12px}
.tag.blue{background:var(--brand-soft);color:var(--brand-text)}
.tag.red{background:var(--red-soft);color:var(--red-text)}
.av{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;background:var(--gray-soft);color:var(--text-2);font:600 12px var(--num);flex:none}
.av.lg{width:40px;height:40px;font-size:16px}
.seg{display:inline-flex;padding:2px;border-radius:6px;background:var(--gray-soft);gap:2px;flex:none;max-width:100%}
.seg button{height:28px;padding:0 10px;border-radius:4px;font-size:14px;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(31,35,41,.12);font-weight:500}
.inp{height:32px;width:100%;border:1px solid var(--line-strong);border-radius:6px;background:var(--card);padding:0 10px;font-size:14px;min-width:0}
.inp.lg{height:40px;padding:0 12px}
.inp:focus,.ta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.sel{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--card);padding:0 8px;font-size:14px;min-width:0}
.ta{width:100%;min-height:150px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);padding:12px 14px;font-size:14px;line-height:1.7;resize:vertical}
.empty{color:var(--text-3);font-size:14px;text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;margin:auto}
.empty [data-lucide],.empty .lucide{width:28px;height:28px}
.empty b{color:var(--text-2);font-weight:500}
.spinner{width:12px;height:12px;border:2px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--line-strong);background:var(--card);font-size:14px;color:var(--text-2);white-space:nowrap}
.chip:hover{background:var(--hover);color:var(--text)}
.chip.on{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand-text)}
.chip small{font:500 12px var(--num);color:var(--text-3)}

/* 统计卡片（兼筛选） */
.greet{display:flex;align-items:flex-end;gap:16px;flex:none;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:none}
.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.st:hover{border-color:var(--line-strong)}
.st.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.st .k{font-size:14px;color:var(--text-2)}
.st .v{font:600 20px/1.4 var(--num);color:var(--text)}
.st .v small{font:400 12px var(--font);color:var(--text-3);margin-left:6px}

/* 左列表 + 右详情 */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:12px}
.libsplit{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(300px,1fr) minmax(340px,440px);gap:12px}
.lcard,.dcard,.fcard{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lrows{flex:1;overflow:auto;padding:4px 0 8px}
.lgh{font-size:12px;color:var(--text-3);padding:12px 16px 4px;display:flex;gap:6px;align-items:center}
.lgh span{font-family:var(--num)}
.lrow{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 16px;align-items:start;cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow.on{background:var(--sel)}
.lrow.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.lc{min-width:0}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:12px;color:var(--text-3)}
.l1 b{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.l1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l2{font-size:14px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pendline{display:flex;align-items:center;gap:6px;min-width:0}
.pendline .t3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l2.t2{color:var(--text-2);font-size:12px}
.lr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-top:2px}
.lrow .hov{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px;box-shadow:0 2px 8px rgba(31,35,41,.08)}
.lrow .hov .ib{width:28px;height:28px}
.lrow:hover .hov{display:flex}
.lrow:hover .lr{visibility:hidden}
.lnote{font-size:12px;color:var(--text-3);padding:10px 16px;border-top:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap}

/* 详情 */
.dbody{flex:1;overflow:auto;padding:20px 24px 24px}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dt{margin:0;font-size:20px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.dm{margin-top:4px;font-size:12px;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mystate{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mystate .lab{font-size:12px;color:var(--text-3)}
.aibox{margin-top:16px;background:var(--brand-soft);border-radius:8px;padding:12px 14px}
.ailab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--brand-text)}
.ailab [data-lucide],.ailab .lucide{width:14px;height:14px}
.ailab .src{margin-left:auto;font-weight:400;color:var(--text-3)}
.aibox p{margin:6px 0 0;font-size:14px;line-height:1.75;color:var(--text)}
.aibox p.t2{color:var(--text-2)}
.conf{margin-top:8px;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.conf .btn.text{font-size:12px;height:24px}
.bul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.75}
.bul li{margin:2px 0}
.sec{margin-top:20px}
.sec-h{font-size:12px;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.code{position:relative;margin-top:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.code .cp{position:absolute;right:6px;top:6px}
details.more{margin-top:20px}
details.more summary{cursor:pointer;font-size:12px;color:var(--text-3);list-style:none;display:flex;align-items:center;gap:4px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.dfoot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}

/* 资料库筛选 */
.fcard{padding:8px 0 12px;overflow:auto}
.fh{font-size:12px;color:var(--text-3);padding:12px 16px 4px;display:flex;align-items:center;gap:8px}
.fi{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:0 8px;padding:6px 8px;border-radius:6px;font-size:14px;color:var(--text-2);text-align:left}
.fi:hover{background:var(--hover);color:var(--text)}
.fi.on{background:var(--brand-soft);color:var(--brand-text)}
.fi span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .n{font:500 12px var(--num);color:var(--text-3)}
.fi.on .n{color:var(--brand-text)}
.libhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.libhead .search{flex:1;min-width:240px;position:relative}
.libhead .search [data-lucide],.libhead .search .lucide{position:absolute;left:12px;top:12px;color:var(--text-3)}
.libhead .search .inp{padding-left:36px}

/* 找方案 */
.solvegrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:12px}
.hit{display:grid;grid-template-columns:22px 28px minmax(0,1fr);gap:10px;padding:12px 16px;align-items:start;border-top:1px solid var(--line-2)}
.hit:first-child{border-top:0}
.circ{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;color:transparent;background:var(--card);margin-top:5px}
.circ [data-lucide],.circ .lucide{width:11px;height:11px;stroke-width:2.4}
.circ:hover{border-color:var(--brand)}
.circ.done{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.hit .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.hit .nm button{font-size:14px;font-weight:500;text-align:left;overflow-wrap:anywhere}
.hit .nm button:hover{color:var(--brand-text)}
.hit .why{font-size:12px;color:var(--text-3);margin-top:2px}
.hit .why b{font-weight:500;color:var(--text-2)}
.hit p{margin:2px 0 0;font-size:14px;line-height:1.6}
.packpre{flex:1;overflow:auto;margin:0;padding:14px 16px;font:12px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--bg)}
.pk-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.hint{font-size:12px;color:var(--text-3);padding:10px 16px;border-top:1px solid var(--line-2)}
.crossnote{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2);font-size:14px;color:var(--text-2);flex-wrap:wrap}

/* 收集 */
.caprow{display:grid;grid-template-columns:22px 28px minmax(0,1fr) auto;gap:10px;padding:10px 16px;align-items:center;border-top:1px solid var(--line-2)}
.caprow:first-child{border-top:0}
.caprow .u{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caprow .nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capsum{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.capsum .sp{flex:1}
.fic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--gray-soft);color:var(--text-2)}
.fic.blue{background:var(--brand-soft);color:var(--brand-text)}
.fic.red{background:var(--red-soft);color:var(--red-text)}

/* 发现 */
.gapcard{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 16px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;align-items:center;border-top:1px solid var(--line-2)}
.cand:first-child{border-top:0}
.cand .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cand .nm a{font-size:14px;font-weight:500}
.cand .nm a:hover{color:var(--brand-text)}
.cand p{margin:2px 0 0;font-size:14px;color:var(--text-2);overflow-wrap:anywhere}
.cand .acts{display:flex;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:500}
.row .rt span{font-size:12px;color:var(--text-3)}

/* 浮层 */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:70px;display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--card);color:var(--text);border-radius:8px;padding:10px 10px 10px 14px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:var(--pop);max-width:100%}
.toast > [data-lucide],.toast > .lucide{color:var(--brand-text)}
.toast .tt span{color:var(--text-3);margin-left:6px;font-size:12px}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:72px}
.cmdk{width:min(560px,calc(100% - 32px));max-height:min(480px,calc(100% - 100px));background:var(--card);border-radius:12px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden}
.cmdk input{height:48px;border:0;border-bottom:1px solid var(--line);padding:0 16px;font-size:16px;background:transparent;outline:none}
.cmdk .res{overflow:auto;padding:6px}
.cmdk .ci{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left}
.cmdk .ci.on,.cmdk .ci:hover{background:var(--hover)}
.cmdk .ci .z{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);font-size:12px}
.cmdk .grp{font-size:12px;color:var(--text-3);padding:8px 10px 2px}
.dwrap{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);z-index:30;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--pop);display:flex;flex-direction:column;min-height:0}
.dwrap .dh{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--line-2);font-weight:600}
.backbtn{display:none}
.about{width:min(560px,calc(100% - 32px));max-height:calc(100% - 100px);overflow:auto;background:var(--card);border-radius:12px;box-shadow:var(--pop);padding:20px 24px}
.about h2{margin:0 0 4px;font-size:20px;font-weight:600}
.about h3{margin:16px 0 6px;font-size:16px;font-weight:600}
.about ul{margin:0;padding-left:18px;line-height:1.75}
.about .t3{font-size:12px}

/* 窄窗口 */
@media (max-width:1240px){
  .libsplit{grid-template-columns:200px minmax(0,1fr)}
  .libsplit .dcard{display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .split .dcard{display:none}
  .solvegrid{grid-template-columns:minmax(0,1fr)}
  .mdet .dcard{display:flex!important;position:absolute;inset:0;z-index:25;border-radius:0;border:0}
  .mdet .backbtn{display:inline-flex}
}
@media (max-width:900px){
  body{padding-inline:0;padding-block:0;gap:0}
  .pbar{padding:8px 16px}
  .app{border-radius:0;box-shadow:none}
  .lights,.sync,.logo b{display:none}
  .q{width:auto;flex:1;margin:0}
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 56px}
  .rail{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 8px;overflow:hidden}
  .rail .sp{display:none}
  .ri{width:auto;flex:1;padding:4px 0}
  .ri .badge{right:calc(50% - 22px)}
  .canvas{padding:12px 16px 16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .libsplit{grid-template-columns:minmax(0,1fr)}
  .libsplit .fcard{max-height:180px}
  .dwrap{width:100%}
  .cand{grid-template-columns:minmax(0,1fr)}
  .caprow{grid-template-columns:22px minmax(0,1fr) auto}
  .caprow .fic{display:none}
}
@media (max-width:900px){.lnote kbd,.lnote span:has(kbd){display:none}.lnote:not(:has(span:not(:has(kbd)))){display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

ex 等编码代理的常见失…","sm":"mattpocock/skills 是一个面向真实工程师的 AI 代理技能库，旨在解决 Claude Code、Codex 等编码代理的常见失败模式。这些技能小巧、可组合、适配任何模型，强调保留用户控制权而非控制流程。它通过“拷问环节”对齐需求、通过 TDD 和调试技能建立反馈循环、通过架构技能对抗软件熵，将软件工程基础浓缩为可重复实践。","cap":["AI Agent","Skills","Claude Code","Codex","Engineering","TDD"],"pr":[],"how":"","form":"技能","mat":"","cn":-1,"real":0,"has":1,"sc":[]},{"id":"230739735:1267314128","n":"tutti-os/tutti","d":"Where people and agents build in tune.","l":"TypeScript","s":3791,"t":"2026-07-06","p":"2026-09-05","tp":["agent-collaboration","agent-orchestration","agent-workspace","agentic-ai","agentic-workflow","ai-agents"],"z":"让人类与AI代理在多工具工作流中和谐协作，消除人工上下文搬运。","sm":"Tutti 是一个促进人类与AI代理（如 Claude Code、Codex、Canvas 等）协作的平台。它旨在解决多代理工作流中的依赖和交接问题，避免人类在代理之间充当“胶水”角色（如手动粘贴文档、重新解释上下文和设计意图）。","cap":["支持多AI代理（如Claude Code, Codex等）之间的依赖管理与任务交接","减少人类在代理间手动传递上下文的负担","提供本地桌面端（macOS）及即将推出的VM环境"],"pr":["解决多AI工具协作时，人类需频繁在工具间手动复制粘贴文档和重新解释上下文的痛点","解决工作流中因代理缺乏交接能力而导致的人类成为流程瓶颈的问题"],"how":"下载 macOS 版的 Tutti · Local 桌面应用，或加入 Tutti · VM 的候补名单（Waitlist）。","form":"应用","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1162021647","n":"kenn-io/agentsview","d":"Local-first session search, analytics, insights, and token use statistics for coding agents, supporting Claude Code, Codex, and more than 20 other agents.","l":"Go","s":6034,"t":"2026-07-06","p":"2026-10-01","tp":[],"z":"agentsview 是一款本地优先的 AI 编程代理会话搜索、分析与成本追踪工具","sm":"agentsview 是一款本地优先的 AI 编程代理会话搜索、分析与成本追踪工具。它支持单一二进制文件运行，无需账户，完全本地处理数据。提供 Web UI 浏览会话，支持窗口分析、缓存经济统计，并能自动同步至 PostgreSQL。兼容 Claude Code、Codex 等 20 多种主流代理，同时支持 Docker 容器化部署与系统级守护进程。","cap":["AI agents","session search","analytics","token usage","local-first","Claude Code"],"pr":[],"how":"","form":"","mat":"","cn":-1,"real":0,"has":1,"sc":["data"]},{"id":"230739735:1283907968","n":"oomol-lab/open-connector","d":"Open-source auth gateway connecting 1500+ SaaS providers to AI agents through SDK, CLI, MCP, HTTP, and OpenAPI.","l":"TypeScript","s":5933,"t":"2026-07-06","p":"2026-10-01","tp":["agen onnet 4.6 等），单次运行可询问一个或多个模型。提供 CLI、Codex 技能和 MCP 三种集成方式。支持 API 模式（需密钥）和浏览器模式（无需密钥，通过自动化 Chrome 实现），推荐 API 模式，浏览器自动化为实验性。支持 macOS、Linux 和 Windows 平台，采用 MIT 许可证。具备会话管理、多模型并发、提供商检查、远程浏览器操作等功能。","cap":["Oracle","AI","GPT-5.5 Pro","Gemini 3.1 Pro","Claude Sonnet 4.6","CLI"],"pr":[],"how":"","form":"","mat":"","cn":-1,"real":0,"has":1,"sc":["auto"]},{"id":"230739735:1234232707","n":"rahilp/second-brain-cloudflare","d":"One memory layer, every AI tool. Store anything once — recall it in Claude, ChatGPT, Cursor, or any MCP client. Self-hosted on Cloudflare's free tier.","l":"TypeScript","s":801,"t":"2026-07-05","p":"2026-09-30","tp":["ai-memory","claude","claude-ai","claude-code","cloudflare","cloudflare-workers"],"z":"Second Brain 是一个为 Claude、ChatGPT、Cursor、Codex 等多种 AI…","sm":"Second Brain 是一个为 Claude、ChatGPT、Cursor、Codex 等多种 AI 工具提供共享持久记忆的开源项目。它解决了用户在不同 AI 工具间切换时上下文、项目、决策和偏好无法同步、需要反复解释的问题。系统基于 Cloudflare Workers 构建，兼容 MCP 协议，部署在用户自己的 Cloudflare 账户中，确保数据由用户控制且不被单一平台锁定。部署过程约需两分钟，采用 MIT 许可证。","cap":["second-brain","MCP","Cloudflare Workers","AI memory","persistent memory","Claude"],"pr":[],"how":"","form":"","mat":"","cn":-1,"real":0,"has":1,"sc":["kb"]},{"id":"230739735:1172702691","n":"hardhackerlabs/podwise-cli","d":"CLI client for podwise.ai — turn any podcast episode into AI-powered insights, designed for use in AI agents and skills workflows.","l":"Go","s":411,"t":"2026-07-05","p":"2026-05-31","tp":[],"z":"将播客转化为 AI 洞察的 CLI 客户端，专为 AI 代理和技能工作流设计。","sm":"Podwise 的 CLI 客户端，用于将播客剧集转化为 AI 驱动的洞察（如转录、摘要、大纲、问答和思维导图）。它专为 AI 代理设计，允许 LLM、技能运行时和自动化管道无需浏览器或人工干预即可获取结构化的播客洞察。","cap":["播客转录","播客摘要","播客大纲","播客问答","播客思维导图"],"pr":["将冗长的播客转化为结构化洞察","为AI代理和自动化管道提供无需人工干预的播客数据获取方式","无需浏览器即可获取播客内容"],"how":"通过 Homebrew (brew install hardhackerlabs/podwise-tap/podwise)、自动脚本 (curl -sL https://raw.githubusercontent.com/hardhackerlabs/podwise-cli/main/install.sh | sh)、手动下载二进制文件或从源码编译安装。安装后运行 `podwise auth` 进行浏览器授权。","form":"命令行","mat":"成熟","cn":0,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1020672081","n":"Usagi-org/ai-goofish-monitor","d":"基于 Playwright 和AI实现的闲鱼多任务实时/定时监控与智能分析系统，配备了功能完善的后台管理UI。帮助用户从闲鱼海量商品中，找到心仪产品。","l":"Python","s":14603,"t":"2026-07-05","p":"2026-05-18","tp":["ai","ai-assistant","ai-tools","automation","gemini","goofish"],"z":"基于 Playwright 和 AI 的闲鱼多任务实时监控工具，提供完整的 Web 管理界面。","sm":"一个基于 Playwright 和 AI 技术的闲鱼智能监控系统。它允许用户通过自然语言创建监控任务，利用多模态模型深度分析商品，支持多任务并发、高级筛选和多渠道通知，并提供 Web 可视化管理界面进行任务、账号和结果管理。","cap":["Web可视化管理（任务、账号、AI标准编辑、运行日志、结果浏览）","AI驱动（自然语言创建任务，多模态模型深度分析商品）","多任务并发（独立配置关键词、价格、筛选条件和AI Prompt）","高级筛选（包邮、新发布时间范围、省/市/区三级区域筛选）","多渠道即时通知（ntfy.sh、企业微信、Bark、Telegram、Webhook）"],"pr":["解决闲鱼商品手动监控效率低下的问题","支持多任务并发监控不同关键词、价格区间和筛选条件","利用AI多模态模型智能分析商品，替代人工判断"],"how":"通过 Docker Compose 部署：1. git clone https://github.com/Usagi-org/ai-goofish-monitor && cd ai-goofish-monitor；2. cp .env.example .env 并编辑填写配置项；3. docker compose up -d 启动；4. 访问 http://127.0.0.1:8000 进入Web UI。若镜像下载慢，可使用 ghcr.nju.edu.cn 加速拉取后重新tag并启动。","form":"应用","mat":"","cn":1,"real":1,"has":1,"sc":["wx","auto","ec"]},{"id":"230739735:312318044","n":"nuxt-content/docus","d":"Write beautiful documentations with Nuxt and Markdown.","l":"TypeScript","s":3108,"t":"2026-07-05","p":"2026-09-30","tp":["documentation-generator","nuxt","nuxt-theme"],"z":"使用 Markdown 和 Vue 组件快速搭建美观、SEO 友好的文档站点。","sm":"Docus 是一个基于 Nuxt 的文档站点生成器（CLI/模板），允许开发者使用 Markdown 和 Vue 组件来构建快速、灵活且 SEO 优化的文档网站，开箱即用拥有精美的设计。","cap":["通过 CLI 快速脚手架创建完整的文档项目","支持 i18n 多语言模板","结合 Markdown 与 Vue 组件编写文档","开箱即用的精美设计","生成快速、灵活且 SEO 优化的文档站点"],"pr":["从零搭建文档站点配置繁琐","Markdown 缺乏复杂交互组件支持","文档站点的 SEO 和性能优化困难"],"how":"本地开发：运行 `npx create-docus my-docs` (或使用 `-t i18n` 创建多语言模板)，然后 `cd my-docs` 并运行 `npm run dev`，访问 `http://localhost:3000`。；在线开发：通过 Vercel 一键部署模板并创建 Git 仓库。","form":"命令行","mat":"","cn":1,"real":1,"has":1,"sc":["seo"]},{"id":"230739735:1274323575","n":"nullpointexception-i/agent-sphere","d":"This project is an AI Agent orchestration platform. It uses an LLM-driven decision engine, combined with capabilities (built-in tools, MCP protocol, CLI execution, browse","l":"Java","s":120,"t":"2026-07-05","p":"2026-10-01","tp":["agent","agentic-ai","ai-agents","java","llm"],"z":"agent-sphere 是一个基于 LLM 决策引擎的 AI Agent 编排平台，实现感知→规划→执…","sm":"agent-sphere 是一个基于 LLM 决策引擎的 AI Agent 编排平台，实现感知→规划→执行→反馈的主闭环。支持内置工具、MCP 协议、CLI 执行和浏览器自动化。采用 Java 21、Spring Boot 3.4.3、React 19、PostgreSQL 14、Redis 7 等技术栈。提供多级模型容错机制确保 LLM 调用高可用性，包含 HistoryLoader 负责历史消息加载与上下文组装。Session Panel 提供 Run List、Tool Call List、Todo List 和 Operation Log 四个视图。采用 MIT 许可证。","cap":["AI Agent","LLM","编排平台","MCP","CLI","浏览器自动化"],"pr":[],"how":"","form":"","mat":"","cn":-1,"real":0,"has":1,"sc":["auto"]},{"id":"230739735:1219644159","n":"bradautomates/claude-video","d":"Give Claude the ability to watch any video. /watch downloads, extracts frames, transcribes, hands it all to Claude.","l":"Python","s":17880,"t":"2026-07-05","p":"2026-09-25","tp":[],"z":"/watch 是一个让 Claude 能够\"观看\"视频的工具，支持通过插件市场或 npx skills…","sm":"/watch 是一个让 Claude 能够\"观看\"视频的工具，支持通过插件市场或 npx skills 全局/单项目安装，零配置启动并自动安装依赖（yt-dlp、ffmpeg）。该工具优先使用免费字幕，仅在视频无字幕时才需 Whisper API key。其工作流程包括获取字幕、按需下载、提取视频帧及时间戳字幕，并将帧作为图像读取，从而使 Claude 能结合视觉和音频信息回答视频相关问题。","cap":["视频分析","Claude","帧提取","字幕","yt-dlp","ffmpeg"],"pr":[],"how":"","form":"","mat":"","cn":-1,"real":0,"has":1,"sc":["vid","auto"]},{"id":"230739735:1170548091","n":"0xNyk/council-of-high-intelligence","d":"Structured multi-perspective deliberation for hard decisions. Run full councils, focused triads, or duo debates across Claude Code, Codex, Gemini CLI, and OpenCode.","l":"Shell","s":4534,"t":"2026-07-05","p":"2026-09-28","tp":["agent-skill","ai-agents","claude-code","codex","decision-making","deliberation"],"z":"Council of High Intelligence 是一个利用18个AI角色跨多个LLM提供商审议…","sm":"Council of High Intelligence 是一个利用18个AI角色跨多个LLM提供商审议用户最艰难决定的开源项目。它可作为Claude Code插件、Codex技能和Gemini CLI扩展使用，支持一键调用 `/council` 命令。项目采用CC0许可证，提供结构化多轮审议、置信度加权裁决和真正的模型多样性。支持多种审议模式（包括Full Mode、classic模式和快速模式），具备多提供商自动路由功能，可自动检测Anthropic、OpenAI、Google、Ollama、NVIDIA NIM和Cursor等提 ex 中打开原生 tldraw 无限画布 widget，无需通过网页浏览器或 in-app browser","在当前项目目录中持久化画布页面和图片资源","在画布中创建 AI 图片框，输入 prompt 和参考图让 Codex 按位置和比例生成图片","从画布提交标注截图，让 Codex 根据标注生成新图并放置在原图旁","通过 MCP 工具读取选择状态、保存画布、插入图片并保存到本地资源目录"],"pr":["解决在 Codex 中无法直接进行可视化构思和图片标注的问题","避免通过网页浏览器或 in-app browser 打开本地页面的繁琐流程","实现图片生成与标注修改在画布中的闭环迭代"],"how":"自动安装：将 README 中提供的安装指令发给 Codex，让其自动 clone 仓库到 ~/plugins/cowart 并配置 personal marketplace 后安装。手动安装：clone 仓库到 ~/plugins/cowart，执行 npm install 和 npm run build，配置 ~/.agents/plugins/marketplace.json，运行 codex plugin marketplace add ~ 和 codex plugin add cowart@personal。安装后开启新 Codex 对话，发送“Open the Cowart canvas for this project.”即可打开画布。","form":"MCP","mat":"","cn":1,"real":1,"has":1,"sc":["img"]},{"id":"230739735:1174289380","n":"Forget-C/Jellyfish","d":"An end-to-end production workspace for AI-generated short dramas. From script input to structured storyboarding, consistency management, shot preparation, video generatio","l":"Python","s":6538,"t":"2026-06-20","p":"2026-07-30","tp":["ai","short-drama"],"z":"端到端的 AI 短剧制作工作流","sm":"Jellyfish 是一个端到端的 AI 短剧制作工作流，旨在将剧本输入、结构化分镜、一致性管理、镜头准备、视频生成和导出等全流程整合在一个工作区内。","cap":["剧本输入","结构化分镜","一致性管理","镜头准备","图像/视频生成"],"pr":["解决 AI 短剧制作流程碎片化的问题，将原本分散的剧本、分镜、生成和追踪环节整合到统一平台。"],"how":"摘录中未提供具体的安装或试用步骤。项目技术栈为前端 React + Vite，后端 FastAPI，并提供了 Docker 镜像构建工作流。","form":"应用","mat":"","cn":0,"real":1,"has":1,"sc":["vid","auto"]},{"id":"230739735:1255800034","n":"zarazhangrui/beautiful-feishu-whiteboard","d":"35 curated colour palette styles for building beautiful, editable Feishu / Lark (飞书) whiteboards. An agent skill.","l":"Shell","s":744,"t":"2026-06-20","p":"2026-06-11","tp":[],"z":"35种精选调色板风格库，用于构建可编辑的飞书白板。","sm":"这是一个代理技能（agent skill），为 Claude Code 及其他读取 SKILL.md 的代理提供 35 种精心策划的调色板风格。它不是自动布局图表工具，而是由代理组合布局，这些模板提供雅致的色彩、情绪以及飞书白板 SVG 渲染器的硬性规则知识，最终生成真实的可编辑飞书白板，而非截图。所有规则基于对飞书渲染器能力的验证，记录在 RULES.md 中。","cap":["提供 35 种从克制到大胆的调色板风格模板","基于飞书 SVG 白板渲染器的验证规则（原生形状、无透明度、文本颜色导出等）","生成可编辑的飞书白板，而非截图","支持 Claude Code 及其他读取 SKILL.md 的代理"],"pr":["飞书白板设计中的调色板选择与渲染规则难题","避免生成静态截图，直接产出可编辑白板","解决代理在构建飞书白板时的风格一致性与渲染兼容性问题"],"how":"作为 Claude Code 技能使用，由代理读取 SKILL.md 调用。","form":"技能","mat":"成熟","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1203468533","n":"palmier-io/palmier-pro","d":"macOS video editor built for AI","l":"Swift","s":14495,"t":"2026-06-20","p":"2026-09-26","tp":["ai-video","claude","macos","mcp","seedance2","swift"],"z":"为 AI 而生的视频编辑器","sm":"Palmier Pro 是一款开源的 Mac 视频编辑器，它允许用户与 AI agent 在时间轴中共同生成和编辑视频。","cap":["视频生成","视频编辑","AI agent 协作","时间轴编辑"],"pr":["传统视频编辑器难以与 AI 工作流无缝结合","实现人与 AI agent 在视频时间轴上的协同创作"],"how":"从 GitHub Releases 下载 PalmierPro.dmg 安装包进行安装（仅支持 macOS 26 Tahoe 及 Apple Silicon 芯片）。","form":"应用","mat":"可用","cn":1,"real":1,"has":1,"sc":["vid"]},{"id":"230739735:770153867","n":"harry0703/MoneyPrinterTurbo","d":"利用 AI 大模型和自动化工作流，根据主题或关键词一键生成高清短视频。Generate HD short videos from a topic or keyword with an automated AI workflow.","l":"Python","s":127633,"t":"2026-06-20","p":"2026-10-01","tp":["ai-video-generator","content-creation","ffmpeg","instagram-reels","llm","python"],"z":"只需提供视频主题或关键词，即可全自动生成文案、素材、字幕、音乐并合成高清短视频。","sm":"一个全自动短视频生成工具，提供Web界面和API接口，能够根据用户提供的主题或关键词，自动完成视频文案撰写、素材获取、字幕生成、背景音乐添加及最终的高清短视频合成。","cap":["自动生成视频文案","自动生成/获取视频素材","自动生成视频字幕","自动生成/添加视频背景音乐","自动合成高清短视频"],"pr":["解决短视频制作流程繁琐、环节众多的问题","降低视频创作门槛，用户无需专业技能只需提供主题或关键词即可出片","自动化视频内容创作与后期剪辑合成流程"],"how":"摘录中未提供具体的安装或部署步骤，但根据README描述，该项目提供Web界面和API界面，用户可通过访问Web界面或调用API接口进行使用。","form":"应用","mat":"","cn":1,"real":1,"has":1,"sc":["vid","auto","dy"]},{"id":"230739735:1274378091","n":"dososo/BLCaptain-Opportunity-PRD-Skill","d":"BLCaptain Opportunity PRD Skill：从社区评论证据挖掘产品机会，并在 Go 后生成可工程实施的商业化 PRD。","l":"Python","s":16,"t":"2026-06-20","p":"2026-06-20","tp":[],"z":"将产品想法从社区真实痛点推进到可工程实施的商业化PRD的Agent Skill。","sm":"这是一个Agent Skill，旨在帮助用户把一个产品想法，从社区评论里的真实痛点出发，经过证据扫描、多模型讨论与Gate决策，最终生成可交付开发的商业化PRD。它支持多种模型Agent（OpenAI-compatible、CLI Agent、本地模型等），并提供模型配置检查与健康检查功能。","cap":["社区评论扫描与真实痛点提取","多模型讨论与Gate决策","商业化PRD生成（可工程实施）","模型配置检查与引导接入","支持OpenAI-compatible、CLI Agent、本地模型等多种模型Agent"],"pr":["解决产品想法到PRD过程中缺乏真实证据、难以工程化的问题，通过证据扫描和多模型讨论确保PRD基于真实痛点且可实施。"],"how":"对支持Skill的Agent说：「帮我安装 BLCaptain Opportunity PRD Skill：仓库 github.com/dososo/BLCaptain-Opportunity-PRD-Skill」。安装后首次使用，让Agent检查模型配置，并根据引导接入DeepSeek / GLM / Claude CLI / Gemini / Grok / 本地模型等。","form":"技能","mat":"","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:876286167","n":"lfnovo/open-notebook","d":"An Open Source implementation of Notebook LM with more flexibility and features","l":"TypeScript","s":39675,"t":"2026-06-20","p":"2026-10-01","tp":["assistant","learning","note-taking","notebook","notes-app","self-learning"],"z":"开源、注重隐私的 Google Notebook LM 替代品","sm":"一个开源的、注重隐私的笔记本应用，旨在作为 Google Notebook LM 的替代方案，提供类似的功能，同时让用户完全掌控自己的数据。","cap":["提供类似 Google Notebook LM 的 AI 笔记本功能，支持文档上传、内容分析和问答等（具体功能需参考官方文档）。"],"pr":["解决了 Google Notebook LM 的隐私顾虑，提供一个可自托管、开源的替代方案，让用户在不牺牲隐私的前提下使用 AI 笔记本服务。"],"how":"访问官方网站 open-notebook.ai，或查阅文档中的“Get Started”和“Deploy”指南进行本地部署。","form":"应用","mat":"","cn":0,"real":1,"has":1,"sc":["kb"]},{"id":"230739735:1186405141","n":"Ancienttwo/repo-harness","d":"File-backed workflow harness for reliable Claude Code and Codex sessions.","l":"TypeScript","s":434,"t":"2026-06-20","p":"2026-09-30","tp":["agentic-workflows","ai-agents","claude-code","codegraph","codex","developer-tools"],"z":"将 Claude/Codex 编码会话转化为可重复的仓库本地工作流，通过文件而非聊天记忆保持会话连续性","sm":"repo-harness 是一个 CLI 工具加技能/运行时钩子，将 Claude/Codex 编码会话转化为可重复的仓库本地工作流。它将上下文、计划、交接、检查和审查证据写回项目，使下一个代理会话可以从文件继续，而不是依赖聊天记忆。","cap":["通过仓库本地文件而非聊天记忆保持代理会话连续性","提供 CLI 和运行时钩子（session-start-context.sh、stop-orchestrator.sh、post-edit-guard.sh）","支持任务优先的代理契约，采用现有仓库","保持 Claude 和 Codex 在计划、检查、交接和上下文边界上对齐","通过预构建的 CodeGraph 和渐进式上下文加载减少 token 消耗"],"pr":["代理会话间依赖聊天记忆导致上下文丢失","每次会话重新扫描仓库浪费 token","Claude 和 Codex 会话间缺乏协调"],"how":"根据 README，你可以：1) 采用任务优先代理契约来适配现有仓库；2) 给代理完整的 PRD 或 Sprint，然后只需审查和执行 `next`，或启动 `/goal` 进入 AFK 模式。README 摘录中未提供具体安装步骤。","form":"命令行","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1239928176","n":"RyensX/OpenCodex","d":"OpenCodex is a middleware layer for Codex/ChatGPT Desktop. It lets you use a phone, tablet, or another computer to access and operate Codex on a target machine through a ","l":"JavaScript","s":715,"t":"2026-06-20","p":"2026-09-13","tp":["chatgpt","codex","codex-desktop"],"z":"通过浏览器随时随地远程访问和操作本地 Codex 的桌面运行时中间层。","sm":"OpenCodex 是一个 Codex 桌面运行时中间层，兼容旧版 Codex Desktop 和新版 ChatGPT Desktop。它允许用户通过浏览器在手机、平板或另一台电脑上访问并操作目标机器上的 Codex，实现随时随地的 AI Coding。","cap":["通过浏览器远程访问目标机器上的 Codex","支持手机、平板、电脑等多种设备访问","无需魔法上网和外区账号，支持三方API登录","支持 Codex 完整功能（文件树、终端、审查等）","支持内网穿透/公网访问，无需经过官方中继服务器"],"pr":["无法随时随地进行 AI Coding","使用 Codex 需要魔法上网或外区 Google Play/苹果账号","官方中继服务器速度慢且存在隐私风险"],"how":"1. 确保本机已安装旧版 Codex Desktop 或新版 ChatGPT Desktop；2. 打开 release 下载安装包安装桌面启动器，或通过 `pnpm install` 和 `pnpm run launcher:dev` 本地调试；3. 也可命令行启动：执行 `pnpm install` 后运行 `PORT=3737 pnpm run web:dev`（支持远程访问可加上 `HOST=0.0.0.0`）；4. 强烈建议复制 `config.example.yaml` 为 `config.yaml` 并配置访问密码；5. 启动后访问 http://127.0.0.1:3737。","form":"应用","mat":"","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1036150999","n":"Haleclipse/CCometixLine","d":"Claude Code statusline tool written in Rust","l":"Rust","s":3470,"t":"2026-06-20","p":"2026-03-14","tp":[],"z":"高性能 Claude Code 状态栏工具，集成 Git、用量追踪和交互式 TUI 配置","sm":"CCometixLine 是一个用 Rust 编写的高性能 Claude Code 状态栏工具。它提供 Git 集成、用量追踪、交互式 TUI 配置界面以及 Claude Code 增强功能，包括上下文警告禁用和详细模式启用。","cap":["Git 集成（分支、状态、追踪信息）","模型显示（简化的 Claude 模型名称）","用量追踪（基于 transcript 分析）","目录显示（当前工作区）","最小化设计（使用 Nerd Font 图标）"],"pr":["为 Claude Code 提供状态栏显示","显示 Git 信息、模型信息、用量信息、目录信息","提供交互式配置界面"],"how":"npm install -g @cometix/ccline","form":"命令行","mat":"","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:881458615","n":"browser-use/browser-use","d":"Agents that use the browser.","l":"Python","s":116862,"t":"2026-06-20","p":"2026-09-30","tp":["ai-agents","ai-tools","browser-automation","browser-use","llm","playwright"],"z":"AI 浏览器代理","sm":"一个 AI 浏览器代理项目，使 AI 能够控制浏览器。","cap":["浏览器控制","AI 代理交互"],"pr":["让 AI 能够像人一样操作网页浏览器"],"how":"访问云服务 https://cloud.browser-use.com 或查阅文档 https://docs.browser-use.com","form":"代码库","mat":"成熟","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1078079172","n":"ComposioHQ/awesome-claude-skills","d":"A curated list of awesome Claude Skills, resources, and tools for customizing Claude AI workflows","l":"Python","s":76185,"t":"2026-06-19","p":"2026-09-18","tp":["agent-skills","ai-agents","antigravity","automation","claude","claude-code"],"z":"精选 1000+ 个生产级 Claude Skills 与插件的 Awesome 列表，覆盖 Claude.ai、Claude Code 及多种编码代理","sm":"一个全面且经过筛选的 1000+ 个生产就绪、实用的 Claude Skills 与插件合集，旨在提升在 Claude.ai、Claude Code 以及 Codex、Cursor、Gemini CLI、Antigravity 等多种编码代理上的生产力。这些技能不仅能生成文本，还能执行发送邮件、创建 Issue 等实际操作。","cap":["提供 1000+ 个经过筛选的 Claude Skills 与插件，覆盖多种使用场景和平台，包括能发送邮件、创建 Issue 等超越纯文本生成的实用技能"],"pr":["解决在 Claude.ai、Claude Code 及各类编码代理中寻找生产就绪、实用的 Skills 与插件的难题，提供一站式精选资源"],"how":"浏览该精选列表，根据需求选择适合的 Skills 或插件（各技能的具体安装方式请参考列表中对应条目）","form":"合集","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1126947080","n":"kepano/obsidian-skills","d":"Agent skills for Obsidian. Teach your agent to use Obsidian CLI and open formats including Markdown, Bases, JSON Canvas.","l":"","s":49047,"t":"2026-06-19","p":"2026-09-15","tp":["agents","agentskills","bases","claude","clawdbot","cli"],"z":"用于 Obsidian 的 Agent Skills 集合，兼容多种 AI 编程工具。","sm":"一个为 Obsidian 笔记应用设计的 Agent Skills 集合，遵循 Agent Skills 规范，可被 Claude Code、Codex 和 Open Code 等兼容规范的 Agent 使用。","cap":["提供 Obsidian 相关的 Agent Skills（如创建和编辑 Obsidian Flavored Markdown），支持通过 Marketplace、npx skills 命令或手动复制/克隆的方式安装到不同的 Agent 环境中。"],"pr":["让 AI Agent 能够理解和使用 Obsidian 特有的 Markdown 语法，从而在 Obsidian 笔记库中实现自动化的内容创建与编辑。"],"how":"1. Marketplace 安装：运行 `/plugin marketplace add kepano/obsidian-skills` 和 `/plugin install obsidian@obsidian-skills`；2. npx 安装：运行 `npx skills add git@github.com:kepano/obsidian-skills.git` 或 HTTPS 链接；3. 手动安装：针对 Claude Code 将仓库内容放入 Obsidian vault 根目录的 `/.claude` 文件夹；针对 Codex 将 `skills/` 目录复制到 `~/.codex/skills`；针对 OpenCode 将整个仓库克隆到 `~/.opencode/skills/obsidian-skills` 并重启。","form":"合集","mat":"","cn":1,"real":1,"has":1,"sc":["kb"]},{"id":"230739735:1134426800","n":"sickn33/agentic-awesome-skills","d":"AAS Core is the local, agent-first control plane for complete catalog discovery, agent-owned selection, stack validation, and planning, backed by 2,400+ agentic skills. I","l":"Python","s":47131,"t":"2026-06-19","p":"2026-10-01","tp":["agent-skills","agentic-skills","ai-agent-skills","ai-agents","ai-coding","ai-workflows"],"z":"一个包含1900+个智能体技能的GitHub库，为Claude Code、Cursor、Gemini CLI等AI编程助手提供可复用的SKILL.md剧本。","sm":"Agentic Awesome Skills 是一个可安装的GitHub库和npm安装器，提供1900+个可复用的`SKILL.md`剧本。它为Claude Code、Cursor、Codex CLI、Autohand Code、Gemini CLI、Antigravity、Kiro、OpenCode、GitHub Copilot等AI编程助手提供可搜索、可安装的技能目录、插件包、工作流和实用文档，旨在帮助智能体在执行重复性任务时获得更好的上下文、更强的约束和更清晰的输出。这是一个独立的社区项目，不隶属于Google。","cap":["提供1900+可复用的SKILL.md剧本","支持多工具技能库安装","提供聚焦的插件包","支持工作流驱动的执行（规划、编码、调试、测试、安全审查、基础设施、产品工作、增长任务）","提供可搜索的技能目录和实用文档"],"pr":["解决AI编程助手缺乏结构化操作指令的问题","避免收集零散的提示词片段","帮助智能体在执行重复性任务时获得更好的上下文、更强的约束和更清晰的输出"],"how":"通过npm安装器安装；从GitHub库安装多工具技能库；从聚焦的插件包开始；进入工作流驱动的执行模式","form":"代码库","mat":"","cn":1,"real":1,"has":1,"sc":["auto","seo"]},{"id":"230739735:1132046564","n":"Dimillian/CodexMonitor","d":"An app to monitor the (Codex) situation","l":"TypeScript","s":4344,"t":"2026-06-19","p":"2026-03-26","tp":["ai","codex","linux","macos","tauri-app"],"z":"CodexMonitor 是一个基于 Tauri 的桌面应用，用于在本地工作区中编排和管理多个 Codex 代理。","sm":"CodexMonitor 是一个使用 Tauri 构建的桌面应用，旨在帮助用户在本地工作区中编排多个 Codex 代理。它提供了侧边栏用于项目管理、主页用于快速操作，以及基于 Codex app-server 协议的对话视图。应用支持工作区持久化、线程管理、工作树隔离、远程后端模式，并集成了丰富的代理控制、自动补全、语音听写以及 Git/GitHub 功能。","cap":["多工作区与线程管理（添加、持久化、分组、排序、固定、重命名、归档、复制、草稿、停止/中断）","为每个工作区生成 codex app-server 实例并恢复线程，跟踪未读/运行状态","工作树与克隆代理支持（隔离工作，支持遗留 .codex-worktrees）","远程后端（守护进程）模式及远程设置辅助（Tailscale 检测/主机引导）","消息编排（图片附件选择/拖拽/粘贴、Queue/Steer 跟进行为、快捷键切换）"],"pr":["解决了同时管理多个 Codex 代理和工作区时的混乱与上下文切换问题","提供了可视化的界面来监控代理运行状态，并支持停止/中断正在进行的任务","简化了工作区隔离与克隆的操作流程，保障并行任务互不干扰"],"how":"","form":"应用","mat":"","cn":0,"real":1,"has":1,"sc":["vid"]},{"id":"230739735:1132137660","n":"hardikpandya/stop-slop","d":"A skill file for removing AI tells from prose","l":"","s":17678,"t":"2026-06-19","p":"2026-03-17","tp":[],"z":"一个用于去除AI写作痕迹的技能。","sm":"Stop Slop 是一个技能（skill），旨在教 Claude 或任何大语言模型识别并移除 AI 写作中常见的可预测短语、结构和节奏，从而使散文更自然、更像人类书写。","cap":["检测并移除 AI 写作中的禁用短语（如开场白、强调词、商业行话、模糊陈述等）","识别并避免结构性陈词滥调（如二元对比、负面列举、戏剧性碎片化等）","执行句子级规则（禁止 Wh- 开头句子、禁用 em 断音、禁止碎片化等）","提供评分维度（直接性、节奏、信任、真实性、密度）以评估文本质量"],"pr":["解决 AI 生成文本中常见的可预测短语、重复结构和机械节奏问题，帮助写作者产出更自然、更人性化的散文。"],"how":"在 Claude Code 中将此文件夹添加为技能；将 SKILL.md 和参考文件上传到 Claude Projects 的项目知识中；将 SKILL.md 中的核心规则复制到自定义指令中；或在 API 调用中将 SKILL.md 包含在系统提示中。","form":"技能","mat":"成熟","cn":0,"real":1,"has":1,"sc":["wr"]},{"id":"230739735:1137212306","n":"op7418/Humanizer-zh","d":"Humanizer 的汉化版本，Claude Code Skills，旨在消除文本中 AI 生成的痕迹。","l":"Python","s":18781,"t":"2026-06-19","p":"2026-09-23","tp":[],"z":"AI 写作去痕工具，将 AI 生成的文本改写得更自然、更像人类书写。","sm":"Humanizer-zh 是一个 Claude Code 技能（中文版），用于去除文本中的 AI 生成痕迹。它能帮助将 AI 生成的内容改写得更自然、更像人类书写的文本，同时也可用于编辑审阅 AI 生成内容和学习识别 AI 写作的常见模式。","cap":["去除AI生成痕迹","改写文本使其更自然","审阅AI生成内容","识别AI写作常见模式"],"pr":["AI生成文本痕迹明显、不够自然","需要将AI文本改写为人类自然书写风格"],"how":"运行 `npx skills add https://github.com/op7418/Humanizer-zh.git` 一键安装（推荐），或克隆到 Claude Code 的 skills 目录。安装后重启 Claude Code，在对话中输入 `/humanizer-zh` 加上需要改写的文本，或直接在对话中要求使用 humanizer 改写。","form":"技能","mat":"","cn":1,"real":1,"has":1,"sc":["wr"]},{"id":"230739735:1136666433","n":"blader/humanizer","d":"Agent skill that removes signs of AI-generated writing from text","l":"Python","s":53164,"t":"2026-06-19","p":"2026-09-28","tp":["agent-skills","ai-humanizer","ai-writing","chatgpt","claude","claude-code"],"z":"一个可移植的 Agent 技能，用于去除文本中的 AI 生成痕迹，使其听起来更自然、更像人类。","sm":"一个可移植的 Agent 技能（纯 Markdown 格式），旨在去除文本中的 AI 生成痕迹，使其听起来更自然、更像人类。由于它是纯 Markdown，因此可以在任何支持技能风格指令的 Agent 框架中运行。","cap":["去除文本中的 AI 生成痕迹，使文本更自然、更像人类","支持语音校准（通过提供个人写作样本来匹配个人写作风格）"],"pr":["AI 生成的文本显得生硬、不自然","需要让文本更像人类书写以通过检测或提升阅读体验"],"how":"1. 使用 Skills CLI 安装：`npx skills add blader/humanizer`；2. 作为 Claude Code 插件安装：`/plugin marketplace add blader/humanizer` 然后 `/plugin install humanizer@humanizer`；3. 手动安装：将 `SKILL.md` 复制到 Agent 的技能目录中。安装后，通过斜杠命令（如 `/humanizer`）或直接请求（如 `Please humanize this text: [your text]`）调用。","form":"技能","mat":"成熟","cn":0,"real":1,"has":1,"sc":["wr","vid"]},{"id":"230739735:1140828898","n":"anthropics/knowledge-work-plugins","d":"Open source repository of plugins primarily intended for knowledge workers to use in Claude Cowork","l":"Python","s":25941,"t":"2026-06-19","p":"2026-09-30","tp":[],"z":"将Claude转变为特定角色（如销售、客服、产品）专家的插件集合，兼容Claude Cowork和Claude Code。","sm":"一组开源插件，旨在将Claude转变为特定工作职能的专家。每个插件捆绑了技能、连接器、斜杠命令和子代理，为特定角色提供开箱即用的支持，并允许用户根据自身公司的工具、术语和流程进行定制，以获得更一致的工作成果。","cap":["捆绑技能、连接器、斜杠命令和子代理","管理任务、日历、日常流程和个人上下文","研究潜在客户、准备电话、审查销售管道、起草外联和构建竞争分析","分类工单、起草回复、打包升级、研究客户上下文及将已解决问题转化为知识库文章","连接多种第三方工具（如Slack、Notion、Jira、HubSpot、Microsoft 365等）"],"pr":["减少在重复个人上下文上花费的时间","帮助团队获得更好、更一致的工作成果","为特定角色提供开箱即用的强大起点"],"how":"该仓库开源了11个插件，专为Claude Cowork构建，同时兼容Claude Code。摘录中未提供具体的安装步骤，仅说明可在上述平台中使用这些插件。","form":"合集","mat":"","cn":0,"real":1,"has":1,"sc":["kb"]},{"id":"230739735:1172963839","n":"openai/plugins","d":"OpenAI Plugins","l":"JavaScript","s":7247,"t":"2026-06-19","p":"2026-09-28","tp":[],"z":"OpenAI 官方的 Codex 插件示例合集，提供 Figma、Notion、iOS/macOS/Web 等多种场景的插件模板。","sm":"这是一个由 OpenAI 维护的 Codex 插件精选示例集合。每个插件位于 plugins/<name>/ 目录下，包含必需的 .codex-plugin/plugin.json 清单文件，以及可选的 skills/、.mcp.json、agents/、commands/、hooks.json 等配套组件。仓库还提供了默认的市场配置文件（marketplace.json）和针对 API 密钥登录用户的独立市场配置（api_marketplace.json）。","cap":["提供多种 Codex 插件实现示例，涵盖：Figma 设计交互（Code to Canvas、设计系统规则）；Notion 规划、研究与知识捕获；iOS/macOS 应用开发（SwiftUI 实现、调试、打包）；Web 应用开发（部署、支付、数据库）；Expo/React Native 开发（SDK 升级、EAS 工作流）；以及 Netlify、Remotion、Google Slides 等第三方服务的 Skill 和 MCP 集成。"],"pr":["解决了开发者在 Codex 环境中缺乏标准化插件参考的问题，为如何构建集成设计工具、协作工具、移动端、桌面端和 Web 端开发工作流提供了现成的清单文件（manifest）和目录结构模板。"],"how":"浏览 plugins/ 目录下的各个插件示例（如 figma、notion、build-ios-apps 等），查看其 .codex-plugin/plugin.json 清单及配套的 skills/、.mcp.json 等文件结构；通过 .agents/plugins/marketplace.json 或 api_marketplace.json 了解插件市场的配置与指向方式。","form":"合集","mat":"","cn":1,"real":1,"has":1,"sc":["img","ppt","kb"]},{"id":"230739735:1073224021","n":"EveryInc/compound-engineering-plugin","d":"Official Compound Engineering plugin for Claude Code, Codex, Cursor, and more","l":"TypeScript","s":25351,"t":"2026-06-19","p":"2026-10-01","tp":["compound","engineering"],"z":"让每一次工程工作都比上一次更轻松的 AI 技能集。","sm":"一套基于“复合工程（Compound Engineering）”理念的 AI 技能（命令/提示词）。它颠覆了传统开发中不断积累技术债务的模式，主张 80% 的时间用于规划与审查，20% 用于执行。通过系统化的头脑风暴、计划、代码/文档审查和知识沉淀，使后续的工程和开发工作越来越容易，形成杠杆效应。","cap":["需求头脑风暴 (/ce-brainstorm)","制定实施计划 (/ce-plan)","代码审查 (/ce-code-review)","文档审查 (/ce-doc-review)","知识沉淀与复用 (/ce-compound)"],"pr":["传统开发中技术债务不断累积","每次功能增加导致代码库复杂度上升","Bug 修复后局部知识丢失，后续人员需重复发现"],"how":"摘录中未提供具体的安装步骤，仅指引查阅技能文档目录 (docs/skills/README.md) 和相关博客文章以了解具体使用方法。","form":"技能","mat":"","cn":0,"real":1,"has":1,"sc":[]},{"id":"230739735:1103643573","n":"openai/skills","d":"Skills Catalog for Codex","l":"Python","s":27831,"t":"2026-06-19","p":"2026-09-08","tp":[],"z":"OpenAI 官方的 Codex Agent 技能目录，提供可复用的指令、脚本和资源。","sm":"Agent Skills 是指包含指令、脚本和资源的文件夹，AI Agent 可以发现并使用它们来执行特定任务。该仓库用于编录供 Codex 使用和分发的技能，实现“一次编写，随处使用”。注意：该仓库已弃用，当前示例请参考 OpenAI Plugins 仓库。","cap":["提供指令、脚本和资源供 AI Agent 发现和使用","帮助团队和个人打包能力，以可重复的方式完成特定任务","支持自动安装（.system）、按名称安装（.curated）和按路径/URL安装（.experimental）"],"pr":["AI Agent 缺乏执行特定任务所需的专业指令和脚本","团队和个人难以将特定任务的能力打包并在不同 Agent 间复用"],"how":"1. .system 目录下的技能在最新版 Codex 中自动安装。\n2. 在 Codex 内部使用 $skill-installer 安装 .curated 或 .experimental 技能。\n3. 按名称安装 Curated 技能：$skill-installer gh-address-comments。\n4. 安装 Experimental 技能：$skill-installer install the create-plan skill from .experimental folder，或提供 GitHub 目录 URL（如 https://github.com/openai/skills/tree/main/skills/.experimental/create-plan）。\n5. 安装后重启 Codex 以加载新技能。","form":"技能","mat":"","cn":0,"real":1,"has":1,"sc":[]},{"id":"230739735:1248955957","n":"code-yeongyu/lazycodex","d":"The one and only agent harness for complex codebases. Project memory, planning, execution, and verified completion inside Codex.","l":"TypeScript","s":3708,"t":"2026-06-19","p":"2026-10-01","tp":["ai","ai-agents","claude","claude-code","cli","codex"],"z":"专为复杂代码库设计的 Codex AI 代理控制框架，集成项目记忆、规划与验证执行。","sm":"LazyCodex 是一个专为复杂代码库设计的 agent harness（代理控制框架），在 Codex 环境中提供项目记忆、规划、执行和验证完成功能。它集成了 OmO（oh-my-openagent）的高质量标准，通过 npx 提供一键安装体验，无需全局安装，旨在消除繁琐的设置仪式。","cap":["项目记忆管理","任务规划","代码执行","验证完成","集成 OmO 代理质量标准"],"pr":["复杂代码库的 AI 代理管理困难","繁琐的安装和设置仪式","缺乏项目记忆导致上下文丢失"],"how":"npx lazycodex-ai install","form":"命令行","mat":"可用","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1108837393","n":"code-yeongyu/oh-my-openagent","d":"OmO: Just type \"mass ulw\" keyword with your prompt. Now you are the master of graph engineering.","l":"TypeScript","s":69695,"t":"2026-06-19","p":"2026-10-01","tp":["ai","ai-agents","anthropic","chatgpt","claude","claude-skills"],"z":"支持多代理框架的 Agent OS，现推出针对 Codex 的简化版 LazyCodex。","sm":"oh-my-openagent (OmO) 是一个 Agent OS，目前正在进行多代理框架的重构，以支持 OpenCode、Codex、Pi 等多种底层框架。它推出了针对 Codex 用户的简化版本 LazyCodex。值得注意的是，该项目由 AI 助手 Jobdori 进行维护。","cap":["支持多种代理框架（OpenCode, Codex, Pi 等）","提供针对 Codex 的极简安装与使用体验（LazyCodex）","AI 辅助的实时开发与项目维护"],"pr":["降低了 oh-my-openagent 原有配置的复杂度","实现了对多种底层代理框架的统一支持"],"how":"运行 `npx lazycodex-ai install` 安装 Codex 版本，或加入 Discord 社区关注开发进展。","form":"技能","mat":"","cn":0,"real":1,"has":1,"sc":[]},{"id":"230739735:1038413113","n":"ChesterRa/cccc","d":"Coordinate your coding agents like a group chat — read receipts, delivery tracking, and remote ops from your phone. One pip install, zero infrastructure. A production‑min","l":"Rust","s":1259,"t":"2026-06-19","p":"2026-09-29","tp":["ai-agents","chatgpt","claude-code","codex-cli","gemini-cli","group-chat"],"z":"像群聊一样协调你的编码代理","sm":"CCCC 是一个持久化的多编码代理协调平台，支持 Claude Code、Codex、ChatGPT Web 等 16 种运行时。它将多个编码代理作为持久、协调的团队运行，提供已读回执、投递追踪、远程群组桥接和移动操作功能，解决多代理工作流中上下文丢失、状态不可见和跨设备操作困难的问题。","cap":["持久化协调多编码代理团队","支持 16 种编码代理运行时","已读回执和投递追踪","远程群组桥接","移动端操作支持"],"pr":["终端滚动丢失上下文","无法确认代理是否已读取消息","启动/停止/恢复操作分散在多个工具中"],"how":"pip install cccc-pair","form":"应用","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:523325759","n":"hmjz100/LinkSwift","d":"一个基于 JavaScript 的网盘文件下载地址获取工具。基于【网盘直链下载助手】修改 ，支持 百度网盘 / 阿里云盘 / 中国移动云盘 / 天翼云盘 / 迅雷云盘 / 夸克网盘 / UC网盘 / 123云盘 八大网盘","l":"JavaScript","s":21080,"t":"2026-06-19","p":"2026-09-10","tp":["123pan","aliyun-drive","aliyunpan","aria2","baidu","baidu-netdisk"],"z":"基于 JavaScript 的网盘文件下载地址获取工具","sm":"一个使用 JavaScript 编写的工具，主要用于获取网盘文件的直接下载地址。","cap":["获取网盘文件的直接下载地址"],"pr":["网盘文件无法直接获取下载地址","GreasyFork 脚本失效或黑产刷子导致无法及时更新（建议覆盖安装）"],"how":"根据 README 提示，前往文中的 [安装] 部分，选择一个合适的源进行覆盖安装（特别是针对从 GreasyFork 来的用户）。","form":"","mat":"","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1085086903","n":"EverMind-AI/EverOS","d":"One portable memory layer for every AI agent: local-first, Markdown-native, user-owned, and self-evolving across apps, tools, and workflows.","l":"Python","s":13318,"t":"2026-06-19","p":"2026-09-30","tp":["agent-memory","agentic-ai","ai","chats","clawdbot","clawdbot-skill"],"z":"一个为智能体和创作者打造的 Python 库及本地优先记忆运行时。","sm":"EverOS 是一个 Python 库和本地优先（local-first）的记忆运行时，专为智能体（agents）和创作者（makers）设计。它提供了一个统一且可移植的记忆层，能够跨越编码助手、应用程序、设备和工作流。EverOS 将对话、文件和代理轨迹以可读的 Markdown 格式进行存储。","cap":["提供跨平台的统一可移植记忆层","支持本地优先（local-first）架构","将对话、文件和代理轨迹存储为可读的 Markdown 格式","适用于编码助手、应用、设备和工作流等多种场景"],"pr":["解决智能体和创作者在不同工具、平台和工作流之间记忆不连贯、不可移植的问题","提供统一的本地记忆存储方案，避免记忆数据分散或丢失"],"how":"请参考仓库中的 Quick Start 文档。","form":"代码库","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1165277268","n":"Panniantong/Agent-Reach","d":"Give your AI agent eyes to see the entire internet. Read & search Twitter, Reddit, YouTube, GitHub, Bilibili, XiaoHongShu — one CLI, zero API fees.","l":"Python","s":86746,"t":"2026-06-19","p":"2026-09-15","tp":["agent-infrastructure","ai-agent","ai-search","automation","bilibili","claude-code"],"z":"一键为 AI Agent 接入 YouTube、Twitter、Reddit、小红书、B站、搜索、网页抓取、GitHub、RSS 等互联网能力，省去逐个配置工具的麻烦。","sm":"Agent Reach 是一个集成化的工具集合，旨在解决 AI Agent 无法直接访问各类互联网平台的问题。它替用户选好、装好、体检好各种接入方式，让 Agent 能够获取 YouTube 字幕、搜索 Twitter、绕过 Reddit 封锁、抓取小红书内容、下载 B 站视频、进行网络搜索、提取网页正文、访问 GitHub 仓库与 Issue、订阅 RSS 源等，而无需用户逐一踩坑配置。","cap":["获取 YouTube 视频字幕","搜索 Twitter 内容（绕过付费 API）","访问 Reddit（绕过 IP 封锁）","抓取小红书内容（处理登录限制）","下载 B 站视频（绕过风控拦截）"],"pr":["AI Agent 缺乏直接访问互联网平台的能力，每个平台都有付费 API、反爬封锁、登录要求或数据清洗门槛，用户需要逐一安装工具、调试配置，Agent Reach 将这些能力打包成一句话即可安装的集成方案。"],"how":"请参考仓库的快速开始文档（README 中的“快速开始”部分），其中提供了安装命令与使用示例。","form":"合集","mat":"","cn":1,"real":1,"has":1,"sc":["xhs","vid","res"]},{"id":"230739735:1181795380","n":"zarazhangrui/follow-builders","d":"AI builders digest — monitors top AI builders on X and YouTube podcasts, remixes their content into digestible summaries. Follow builders, not influencers.","l":"JavaScript","s":6820,"t":"2026-06-18","p":"2026-09-30","tp":[],"z":"AI驱动的摘要技能，追踪顶尖AI构建者的动态并投递到你的聊天应用中。","sm":"一个AI驱动的信息摘要技能，专注于追踪AI领域真正做事的构建者（研究员、创始人、PM、工程师），而非复述信息的网红。它会自动汇总他们的播客、X/Twitter帖子及官方博客文章，并投递到用户指定的消息应用中。","cap":["追踪26位AI构建者的X/Twitter动态","汇总顶级AI播客的新剧集","抓取AI公司官方博客（如Anthropic Engineering）全文","支持每日或每周摘要投递","支持Telegram、Discord、WhatsApp等多种投递渠道"],"pr":["在海量AI信息中筛选出真正有原创观点的构建者动态","免去手动编辑配置文件和获取API密钥的麻烦","避免被只会复述信息的AI网红干扰"],"how":"在OpenClaw或Claude Code等Agent中安装该技能，然后对Agent说“set up follow builders”或调用“/follow-builders”。Agent会引导你完成设置（选择频率、语言和投递方式），无需配置文件和API密钥，设置完成后立即收到第一份摘要。","form":"技能","mat":"","cn":1,"real":1,"has":1,"sc":["wr","res"]},{"id":"230739735:1269395331","n":"Waishnav/devspace","d":"Minimal Coding Agent Harness on MCP for ChatGPT, Claude, Hermes, Grok Bot, OpenClaw","l":"TypeScript","s":5180,"t":"2026-06-18","p":"2026-09-28","tp":["agent-orchestration","chatgpt","claude","claude-code","codex","dyanmic-workflow"],"z":"将 Codex 风格的编码工作流引入 ChatGPT，通过自托管 MCP 服务器安全连接本地项目。","sm":"DevSpace 是一个自托管的 MCP 服务器，它允许 ChatGPT 在你的真实本地项目中读取、编辑、搜索和运行代码（包括你的文件、工具和终端），而无需将任何内容上传到第三方。","cap":["读取本地项目代码","编辑本地项目代码","搜索本地项目代码","在本地运行代码和终端命令","通过受控隧道暴露本地环境"],"pr":["ChatGPT 无法直接安全访问本地项目文件的问题","避免将私有代码上传到第三方服务器的安全隐患","将 ChatGPT 转变为类似 Codex 的本地编码助手"],"how":"在你的机器上运行它（npm 包名为 @waishnav/devspace），通过你控制的隧道暴露它，并使用只有你拥有的密码批准连接。","form":"MCP","mat":"","cn":0,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1271627791","n":"rebel0789/codexpro","d":"Use ChatGPT Developer Mode as a local coding agent for your repo through MCP.","l":"JavaScript","s":2077,"t":"2026-06-18","p":"2026-09-20","tp":["apps-sdk","chatgpt","cloudflare-tunnel","codex","local-development","mcp"],"z":"面向 ChatGPT 的本地编码工具，限定于单个仓库。","sm":"CodexPro 是一个本地 MCP 服务器，为 ChatGPT 提供限定于单个仓库的编码工具，使其能够读取文件、搜索代码、进行限定范围的编辑以及运行安全的验证命令。","cap":["读取文件和检查仓库","搜索代码","使用 write、edit 或受保护的 apply_patch 进行限定范围的编辑","运行安全的验证命令"],"pr":["让 ChatGPT 能够安全地操作本地单个仓库的代码，将 AI 的编码能力限定在特定项目范围内，避免越权操作。"],"how":"1. 确保已安装 Node.js 20+；2. 运行 npm install -g codexpro 全局安装 CLI；3. 进入目标仓库目录，运行 codexpro setup，复制输出的 Server URL；4. 在 ChatGPT 中开启开发者模式，创建插件并粘贴 Server URL，选择无认证；5. 日常使用时在仓库目录运行 codexpro start。","form":"命令行","mat":"","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1226917411","n":"freestylefly/CodexGuide","d":"CodexGuide：面向全球初学者、创作者、开发者与团队的 Codex 实践指南","l":"TypeScript","s":3686,"t":"2026-06-18","p":"2026-09-11","tp":[],"z":"Codex 实践指南，帮助初学者到团队快速上手并集成到工作流","sm":"一个面向全球初学者、创作者、开发者与团队的 Codex 实践指南，提供在线文档、学习路线、快速上手、进阶教程、实战案例和参考手册，帮助用户从第一次上手到将 Codex 接入真实工作流。","cap":["学习路线","快速上手指南","进阶教程","实战案例","参考手册"],"pr":["节省摸索 Codex 的时间","帮助不同背景的人使用 Codex 完成开发、创作、研究、自动化与团队协作","将 Codex 接入真实工作流"],"how":"访问在线网站 https://codexguide.ai/ 或查看仓库中的 docs 目录","form":"合集","mat":"成熟","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:806879762","n":"nolly-studio/cult-ui","d":"Components crafted for Design Engineers. Styled using Tailwind CSS, fully compatible with Shadcn, and easy to integrate—just copy and paste. MIT 🤌","l":"TypeScript","s":6234,"t":"2026-06-18","p":"2026-10-01","tp":["components","design-engineering","framer-motion","nextjs","react","shadcn-ui"],"z":"可复制粘贴的 UI 组件与 AI 代理模式集合，助你快速构建应用。","sm":"一个开源、免费的组件库，提供可访问且可定制的 UI 组件，可直接复制粘贴到你的应用中。同时包含 92 种以上的 AI 代理模式，涵盖竞争对手研究、数据分析、无障碍审计等场景，支持实时交互预览，并可通过 shadcn 安装、下载为 Next.js 应用或在 v0 中打开。","cap":["提供可访问、可定制的 UI 组件，支持复制粘贴","包含 92+ 种 AI 代理模式，覆盖研究、分析、审计等场景","实时交互预览 AI 代理模式","支持通过 shadcn 安装、下载为 Next.js 应用或在 v0 中打开","可用于构建自有组件库"],"pr":["减少从零设计 UI 组件的时间成本","加速 AI 应用开发，提供即拿即用的代理模式","解决网站无障碍合规审计的自动化需求"],"how":"通过 shadcn 安装，下载为 Next.js 应用，或在 v0 中打开。","form":"合集","mat":"","cn":1,"real":1,"has":1,"sc":["data"]},{"id":"230739735:996329491","n":"MrLesk/Backlog.md","d":"Backlog.md - A tool for managing project collaboration between humans and AI Agents in a git ecosystem","l":"TypeScript","s":6913,"t":"2026-06-17","p":"2026-09-28","tp":["agent","agentic-ai","management","markdown","project","task-manager"],"z":"Markdown 原生的任务管理与看板工具，让你在 AI 写代码时审查任务。","sm":"Backlog.md 是一个基于纯 Markdown 文件和零配置 CLI 的项目看板工具。它将任何文件夹转化为自包含的项目板，专为 AI 代理时代设计。它通过将代理工作围绕三个审查检查点（审查规范、审查差异、审查结果）进行结构化，解决人类审查注意力跟不上 AI 生成速度的瓶颈。","cap":["Markdown 原生任务管理","看板可视化","零配置 CLI","自包含项目板","AI 代理工作流审查"],"pr":["AI 代理生成代码速度远超人类审查速度的瓶颈","缺乏在代码编写前、中、后对任务规范进行结构化审查的机制"],"how":"npm i -g backlog.md","form":"命令行","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:764419211","n":"blackboardsh/electrobun","d":"Build ultra fast, tiny, and cross-platform desktop apps with Typescript.","l":"TypeScript","s":12861,"t":"2026-06-16","p":"2026-10-01","tp":[],"z":"一个用 TypeScript 构建、更新和分发超快、极小、跨平台桌面应用的完整解决方案。","sm":"Electrobun 旨在成为一个用于构建、更新和分发超快、极小、跨平台桌面应用的完整“开箱即用”解决方案，使用 TypeScript 编写。底层使用 Bun 执行主进程并打包 webview 的 TypeScript，并使用 Objc、C++ 和 Zig 编写原生绑定。","cap":["使用 TypeScript 编写主进程和 webview 代码","主进程与 webview 进程隔离，并提供快速、类型化的 RPC 通信","ZSTD 压缩生成极小的自解压分发包（小至 16MB）","Zig 优化的 BSDIFF 实现极小的应用增量更新（小至 4KB）","通过 bundleCEF 打包和固定 Chromium 以保证一致性"],"pr":["简化了使用 TypeScript 构建跨平台桌面应用的流程，无需过多考虑底层配置","解决了桌面应用分发体积过大的问题","解决了桌面应用更新包过大的问题"],"how":"通过 npm 使用，运行 npx electrobun init 从模板开始。","form":"","mat":"","cn":0,"real":1,"has":1,"sc":[]},{"id":"230739735:1188775349","n":"hanshuaikang/nezha", ervability platform","l":"TypeScript","s":1799,"t":"2026-06-14","p":"2026-09-30","tp":[],"z":"基于 OpenTelemetry 和 ClickHouse 构建的开源可观测性平台，统一处理 traces、logs 和 metrics。","sm":"Maple 是一个开源的可观测性 Monorepo 项目，提供基于 OpenTelemetry 和 ClickHouse 的 traces、logs 和 metrics 收集、存储与展示。项目包含基于 TanStack Router 的 SPA 网页端、基于 Effect 的后端 API、OTLP 采集网关、告警评估、AI 聊天辅助及移动端应用。","cap":["基于 OpenTelemetry 的 traces、logs 和 metrics 可观测性","OTLP 采集网关（支持密钥认证、组织丰富化、采集器转发）","嵌入式 ClickHouse 存储","SPA 仪表盘 (TanStack Router + Vite)","告警评估工作流"],"pr":["统一管理与查询 traces、logs 和 metrics 数据","提供标准化的 OTLP 数据采集与转发","通过嵌入式 ClickHouse 实现轻量级本地可观测性部署"],"how":"确保安装 Bun >=1.3；执行 `bun install` 安装依赖；本地一键体验：运行 `brew install Makisuo/tap/maple` 安装，然后执行 `maple start` 启动包含 OTLP 采集、嵌入式 ClickHouse 和仪表盘的本地二进制；开发模式：运行 `bun run dev` 启动所有开发任务，或使用 `bun --filter=@maple/web dev` 等命令启动特定应用","form":"合集","mat":"","cn":0,"real":1,"has":1,"sc":["res","auto"]},{"id":"230739735:1266923310","n":"nolangz/pixel2motion","d":"AI logo animation skill: turn raster logos into smooth SVG animation, animated HTML demos, GIF/video previews, and motion QA evidence.","l":"Python","s":2361,"t":"2026-06-13","p":"2026-08-21","tp":["ai-animation","ai-design-tools","animated-logo","brand-motion","claude-skill","codex-skill"],"z":"将像素 logo 转换为平滑 SVG 并生成品牌动效 HTML 演示的 AI 技能。","sm":"一个开源的 Codex 和 Claude 技能，专注于 logo 动画、SVG 动画和 AI 辅助品牌动效。它能将 PNG、JPG、WebP 或截图 logo 转换为干净的动效就绪 SVG，然后导出动画 logo HTML、GIF/视频预览和动效 QA 证据。","cap":["像素 logo 转平滑 SVG（像素到矢量重建）","生成 SVG logo 动效","导出交互式 HTML 动效演示","导出 GIF/视频预览","生成动效 QA 证据"],"pr":["像素 logo 无法直接用于高质量动效，需繁琐的手动矢量化","手动制作 logo 动效和 reveal 效果耗时且门槛高","缺乏可审查的矢量拟合过程和可复用的 SVG 结构"],"how":"访问商业预览网站查看效果 (https://www.pixel2motion.com)；查看实时交互式演示 (https://nolangz.github.io/pixel2motion/)；阅读仓库中的 Skill 说明文档 (SKILL.md)；查看配套的 Pixel2SVG-HTML 技能","form":"技能","mat":"","cn":1,"real":1,"has":1,"sc":["vid","img"]},{"id":"230739735:1033778670","n":"iOfficeAI/AionUi","d":"Open-source 24/7 Cowork app for OpenClaw, Hermes, Claude Code, Codex, OpenCode and 20+ more CLI Age 。","sm":"这是一个包含 Anthropic 为 Claude 实现的各种技能（Skills）的仓库。技能是指令、脚本和资源的文件夹，Claude 会动态加载它们以提升在特定任务上的表现。该仓库的技能涵盖创意应用（艺术、音乐、设计）、技术任务（测试 Web 应用、生成 MCP 服务器）以及企业工作流（通信、品牌等）。每个技能都是自包含的文件夹，包含一个 SKILL.md 文件，其中记录了 Claude 使用的指令和元数据。","cap":["动态加载指令、脚本和资源以提升特定任务表现","创建符合特定品牌指南的文档","使用组织特定的工作流分析数据","自动化个人任务","支持创意类任务（艺术、音乐、设计）"],"pr":["解决 Claude 在特定专业领域或企业工作流中缺乏针对性知识的问题","提供可重复、标准化的任务执行方式","允许用户将组织特定的品牌指南、数据分析方法等集成到 Claude 中"],"how":"浏览仓库中的各个技能文件夹，查看其中的 SKILL.md 文件以了解指令和元数据，从中获取灵感或学习不同的模式与方法。（注：摘录中未提供具体的安装或运行步骤，仅说明可浏览和查阅）","form":"技能","mat":"","cn":1,"real":1,"has":1,"sc":["auto"]},{"id":"230739735:1073224795","n":"obra/superpowers","d":"An agentic skills framework & software development methodology that works.","l":"Shell","s":293523,"t":"2026-06-12","p":"2026-09-27","tp":["ai","brainstorming","coding","obra","sdlc","skills"],"z":"一套完整的编码代理软件开发方法论，基于可组合技能与初始指令构建。","sm":"Superpowers 是一套面向编码代理的完整软件开发方法论，建立在可组合技能集和一些确保代理使用这些技能的初始指令之上。它通过引导需求确认、规范提取、实施计划和子代理驱动开发，使编码代理能够自主、规范地完成软件开发任务。","cap":["引导用户明确真实需求，避免代理直接跳入编码","从对话中提取设计规范并分块展示给用户确认","生成强调 TDD、YAGNI 和 DRY 的实施计划","启动子代理驱动开发流程，支持代理自主工作数小时","可集成到多种编码代理工具（如 Claude Code、Cursor、Codex CLI 等）"],"pr":["编码代理缺乏系统化的软件开发流程","编码代理跳过需求确认和规范，导致产出偏离目标","编码代理难以进行真正的测试驱动开发"],"how":"将 Superpowers 集成到支持的编码代理中，例如 Claude Code、Cursor、Codex CLI、GitHub Copilot CLI 等。摘录未提供具体安装步骤，请参考各代理的官方文档。","form":"合集","mat":"","cn":0,"real":1,"has":1,"sc":[]},{"id":"230739735:1075431749","n":"karpathy/nanochat","d":"The best ChatGPT that $100 can buy.","l":"Python","s":58360,"t":"2026-06-12","p":"2026-09-07","tp":[],"z":"单GPU节点训练LLM的极简实验框架，覆盖分词到推理全流程","sm":"nanochat是一个极简的LLM训练实验框架，设计用于在单个GPU节点上运行。代码精简且易于修改，覆盖LLM所有主要阶段：分词、预训练、微调、评估和推理。通过设置单一复杂度旋钮--depth（transformer层数），自动计算所有超参数，训练计算最优模型。","cap":["单GPU节点LLM训练","全流程覆盖：分词、预训练、微调、评估、推理","--depth参数自动计算最优超参数","低成本训练GPT-2级别模型（约$48/2小时8XH100）","CLI对话界面"],"pr":["降低LLM训练成本和门槛","提供极简可修改的训练代码","自动化超参数配置"],"how":"README未提供具体安装步骤，可通过DeepWiki、Discussions或Discord #nanochat频道获取帮助","form":"命令行","mat":"实验","cn":0,"real":1,"has":1,"sc":[]},{" t 获取更多信息。","form":"命令行","mat":"","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1245699721","n":"KunAgent/Kun","d":"Local-first AI agent workspace for coding, writing, design, research, and automation — one runtime for desktop GUI and TUI.","l":"TypeScript","s":6322,"t":"2026-06-04","p":"2026-10-01","tp":["agentic-workflow","ai-agent","ai-assistant","ai-design","automation","coding-agent"],"z":"Kun 是一款需求先行的 AI 编程桌面应用，通过 DeepSeek、Xiaomi MiMo 和 MiniMax 的高性价比组合，将需求澄清、设计、编码和写作整合进一条完整的 GUI 工作流。","sm":"Kun 是一款面向未来编程方式的产品实验，它不再从“给 Agent 一句话直接改代码”开始，而是从需求澄清出发，将需求文档、设计稿、交互原型、实施计划、Todo、Agent 编码和变更审查整合到一条连续的 GUI 工作流中。它包含 Code 模式（处理代码、需求、计划和变更审查）、Design 模式（生成和迭代 UI 设计稿、交互原型与共享设计系统）以及独立的 Write 工作区（用于写作、润色和导出文档）。Kun 内置同名本地运行时，通过 `kun serve` 连接桌面端，会话、日志、偏好设置和运行时配置默认保存在本机，模型请求使用用户自己的凭据。","cap":["需求澄清与文档生成","UI 设计稿与交互原型迭代","共享设计系统管理","本地目录代码处理与变更审查","实施计划与 Todo 管理"],"pr":["解决 AI 编程中缺乏前期需求澄清和设计规划的问题","降低多轮澄清、调研、规划、执行和验证的模型成本","提供从需求到代码再到变更审查的完整闭环工作流"],"how":"从 GitHub releases 下载应用，或通过 `kun serve` 连接桌面端运行源码。","form":"应用","mat":"","cn":1,"real":1,"has":1,"sc":["auto","wr","img"]},{"id":"230739735:1255035312","n":"233i/ore-code","d":"DeepSeek-first desktop coding agent workbench","l":"TypeScript","s":105,"t":"2026-06-03","p":"2026-08-03","tp":[],"z":"一个面向真实项目的 DeepSeek 优先桌面编码智能体工作台。","sm":"Ore Code 是一个围绕真实工作区上下文构建的桌面编码智能体。它结合了 TypeScript 智能体运行时、React/Tauri 桌面应用以及用于本地文件、Shell、进程、Git、钥匙串、工件和 MCP 操作的 Rust OS 边界。","cap":["长上下文编码","结构化工具执行","本地项目上下文感知","支持 DeepSeek / Mimo / Ark Coding 提供商","MCP 集成"],"pr":["解决编码智能体在真实项目中需要检查项目、运行命令、保持上下文连贯性的需求","提供本地化的系统操作能力（文件、Shell、进程、Git、钥匙串等）"],"how":"从 GitHub Releases 下载 macOS (Apple Silicon) 的 DMG 文件进行安装（Windows 版本待定）。","form":"应用","mat":"可用","cn":1,"real":1,"has":1,"sc":[]},{"id":"230739735:1122347787","n":"nguyenphutrong/quotio","d":"Stop juggling AI accounts. Quotio is a beautiful native macOS menu bar app that unifies your Claude, Gemini, OpenAI, Qwen, and Antigravity subscriptions – with real-time ","l":"Swift","s":4875,"t":"2026-06-03","p":"202   let rest = (q || "").toLowerCase(); const main = [];
  for (const w of LEX) if (rest.includes(w)) { main.push(w); rest = rest.split(w).join(" "); }
  const extra = tokens(rest).filter(t => t.length >= 2);
  return { main, extra };
}
function fieldScore(t, k) { const w = idf(k); let m = 0; if (t.name.includes(k)) m = Math.max(m, 3 * w); if (t.z.includes(k)) m = Math.max(m, 2.5 * w); if (t.cap.includes(k) || t.pr.includes(k)) m = Math.max(m, 2 * w); if (t.sc.includes(k)) m = Math.max(m, 2 * w); if (t.sm.includes(k)) m = Math.max(m, 1.5 * w); if (t.d.includes(k)) m = Math.max(m, w); return m; }
function search(q) {
  const c = concepts(q); if (!c.main.length && !c.extra.length) return [];
  const out = [];
  ITEMS.forEach((it, i) => {
    const t = TEXT[i]; let s = 0, matched = 0; const missing = [];
    for (const k of c.main) { const m = fieldScore(t, k); if (m > 0) { matched++; s += m; } else missing.push(k); }
    for (const k of c.extra) s += 0.3 * fieldScore(t, k);
    if (matched > 1) s *= 1 + 0.6 * (matched - 1);
    if (s > 0) out.push({ it, s, matched, total: c.main.length, missing });
  });
  return out.sort((a, b) => b.s - a.s || b.it.s - a.it.s);
}
function why(it, keys) {
  for (const f of [...it.pr, ...it.cap, it.z]) { const lf = (f || "").toLowerCase(); if (keys.some(k => lf.includes(k))) return f; }
  return it.pr[0] || it.cap[0] || it.z || "";
}

/* ---------- 链接识别（Rust 版的简化移植，仅用于原型） ---------- */
const URL_RE = /(?:https?:\/\/|(?<![A-Za-z0-9.@\/:_-])(?:github\.com|x\.com|twitter\.com|mp\.weixin\.qq\.com)\/)[A-Za-z0-9\-._~:\/?#\[\]@!$&()*+,;=%]+/gi;
const GH_RESERVED = new Set(["about","account","apps","blog","codespaces","collections","contact","copilot","customer-stories","discussions","enterprise","explore","features","git-guides","issues","join","login","logout","marketplace","new","notifications","orgs","organizations","password_reset","pricing","pulls","readme","resources","search","security","sessions","settings","signup","sitemap","solutions","sponsors","stars","topics"]);
function trimTail(s) { for (;;) { const c = s.slice(-1); const cnt = (x) => (s.match(new RegExp("\\" + x, "g")) || []).length; if (".,;:!?*".includes(c)) s = s.slice(0, -1); else if (c === ")" && cnt("(") < cnt(")")) s = s.slice(0, -1); else if (c === "]" && cnt("[") < cnt("]")) s = s.slice(0, -1); else return s; } }
function blockedReason(u) {
  const h = u.hostname.toLowerCase().replace(/\.$/, ""), bare = h.replace(/^\[|\]$/g, "");
  if (u.username || u.password) return "链接不能带账号密码";
  if (h === "localhost" || /\.(localhost|local|internal|lan)$/.test(h)) return "本机或内网地址，不收";
  if (/^::ffff:/i.test(bare) || bare === "::1" || /^f[cd][0-9a-f]{2}:/i.test(bare) || /^fe[89ab][0-9a-f]:/i.test(bare)) return "本机、内网或云元数据地址，不收";
  const m = bare.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if (m) { const a = +m[1], b = +m[2]; if (a === 10 || a === 127 || a === 0 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168) || (a === 169 && b === 254) || (a === 100 && b >= 64 && b <= 127)) return "本机、内网或云元数据地址，不收"; }
  return null;
}
const PLAT = { "github.com": "github", "x.com": "x", "mp.weixin.qq.com": "wechat", "xiaohongshu.com": "xiaohongshu", "xhslink.com": "xiaohongshu", "bilibili.com": "bilibili", "youtube.com": "youtube", "youtu.be": "youtube" };
function extract(text) {
  const out = [], seen = new Set();
  for (const m of text.matchAll(URL_RE)) {
    const raw = trimTail(m[0]); if (raw.length < 8) continue;
    const url = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
    let u; try { u = new URL(url); } catch (e) { continue; }
    let host = u.hostname.toLowerCase().replace(/^www\./, ""); if (["twitter.com","mobile.twitter.com","m.twitter.com","mobile.x.com"].includes(host)) host = "x.com";
    const segs = u.pathname.split("/").filter(Boolean);
    const L = { url, kind: "web", platform: PLAT[host] || "web", owner: null, name: null, blocked: blockedReason(u), norm: "" };
    if (host === "github.com" && segs[0]) {
      const reserved = GH_RESERVED.has(segs[0].toLowerCase()), name = segs[1] ? segs[1].replace(/\.git$/, "") : null, ok = x => /^[A-Za-z0-9._-]+$/.test(x || "");
      if (!reserved && ok(segs[0]) && ok(name)) { L.kind = "repo"; L.owner = segs[0]; L.name = name; L.norm = ("https://github.com/" + segs[0] + "/" + name).toLowerCase(); }
      else { L.kind = "gh"; L.norm = ("https://github.com/" + segs.join("/")).toLowerCase(); }
    } else if (host === "x.com") {
      const i = segs.findIndex(s => s === "status" || s === "statuses"), id = i >= 0 ? segs[i + 1] : null;
      if (id && /^\d+$/.test(id)) { L.kind = "xpost"; L.norm = "https://x.com/" + (segs[0] || "").toLowerCase() + "/status/" + id; } else { L.kind = "x"; L.norm = "https://x.com/" + segs.join("/"); }
    } else {
      u.hash = ""; const keep = [];
      u.searchParams.forEach((v, k) => {
        const lk = k.toLowerCase();
        if (host === "mp.weixin.qq.com") { if (!u.pathname.startsWith("/s/") && ["__biz","mid","idx","sn"].includes(k)) keep.push([k, v]); }
        else if (!(lk.startsWith("utm_") || ["fbclid","gclid","igshid","spm","xsec_source","xsec_token"].includes(lk) || lk.startsWith("share_"))) keep.push([k, v]);
      });
      L.norm = u.protocol + "//" + host + (u.pathname.replace(/\/+$/, "") || "/") + (keep.length ? "?" + keep.map(([k, v]) => k + "=" + v).join("&") : "");

}

function runSolve() {
  const c = concepts(S.solve.q), res = search(S.solve.q).filter(x => x.it.has).slice(0, 8);
  S.solve.ran = true; S.solve.keys = [...c.main, ...c.extra]; S.solve.total = c.main.length; S.solve.hits = res.map(x => x.it);
  S.solve.info = Object.fromEntries(res.map(x => [x.it.id, x]));
  S.solve.full = res.some(x => x.total > 0 && x.matched === x.total) || !c.main.length;
  S.solve.missingAll = c.main;
  // 只默认勾选「所有意图都对上了」的；没有就一个都不勾，不硬凑
  const fullHits = S.solve.hits.filter(i => { const x = S.solve.info[i.id]; return x.total === 0 || x.matched === x.total; });
  S.solve.picked = new Set(fullHits.slice(0, 3).map(i => i.id));
}

  const q = S.solve.q, picked = S.solve.hits.filter(i => S.solve.picked.has(i.id));
  if (S.solve.fmt === "json") return JSON.stringify({ title: "参考包：" + q, problem: q, items: picked.map((i, k) => ({ role: k === 0 ? "主参考" : "备选", name: i.n, url: "https://github.com/" + i.n, stars: i.s, summary: i.z, capabilities: i.cap.slice(0, 4), how_to_try: cleanHow(i) })), instruction: "请先阅读参考项目链接，优先复用主参考的做法；不确定先问我，不要编造安装步骤。" }, null, 2);
  const body = picked.map((i, k) => `### ${k + 1}. ${i.n}（${k === 0 ? "主参考" : "备选"}）\n- 链接：https://github.com/${i.n} · ★${fmtStars(i.s)} · 最近更新：${ago(i.p)}\n- 它是什么：${i.z}\n${i.cap.length ? "- 可借鉴的能力：" + i.cap.slice(0, 3).join("；") + "\n" : ""}${cleanHow(i) ? "- 怎么试：" + cleanHow(i) + "\n" : ""}`).join("\n");
  const head = S.solve.fmt === "agents" ? `## 参考项目（来自 Fox Stars Lab）\n> 我要解决：${q}\n\n` : `# 参考包：${q}\n> 由 Fox Stars Lab 生成于 ${ASOF}。只含事实摘要与链接，具体以各项目 README 与许可证为准。\n\n## 我要解决的问题\n${q}\n\n## 参考项目\n`;

}

  if (S.about) app.insertAdjacentHTML("beforeend", aboutHTML());
  $("#themeSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S.theme));
  document.documentElement.dataset.theme = S.theme === "auto" ? "" : S.theme; if (S.theme === "auto") document.documentElement.removeAttribute("data-theme");
  icons();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch (e) {} } }
  if (S.cmdk.open && !fid) { const el = $("#cmdkq"); if (el) el.focus(); }
}

/* ---------- 交互 ---------- */
const DETAIL_PAGES = ["today", "lib"];
function visibleList() { if (S.page === "lib") return libList(); if (S.page === "today") { const f = S.todayFilter; const base = f === "new" ? WEEK : f === "pend" ? WEEK.filter(i => !i.has) : f === "want" ? ITEMS.filter(i => S.status[i.id] === "want") : ITEMS.filter(i => S.status[i.id] === "use"); const picks = f === "new" ? PICKS.filter(i => !S.status[i.id]) : []; return [...picks, ...base.filter(i => !picks.includes(i))]; } return []; }
function move(d) { const L = visibleList(); if (!L.length) return; const i = L.findIndex(x => x.id === S.sel); const n = L[Math.max(0, Math.min(L.length - 1, (i < 0 ? 0 : i + d)))]; S.sel = n.id; render(); const el = document.querySelector(".lrow.on"); if (el) el.scrollIntoView({ block: "nearest" }); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  if (a === "cmdkclose") { if (e.target === t) { S.cmdk.open = false; render(); } return; }
  if (a === "aboutclose") { if (e.target === t || t.classList.contains("btn")) { S.about = false; render(); } return; }
  if (a === "about") { S.about = true; render(); return; }
  if (e.target.closest(".cmdk") && a !== "cmdkgo") return;
  switch (a) {
    case "go": S.page = t.dataset.p; S.drawer = null; S.mdet = false; S.cmdk.open = false; render(); return;
    case "pick": S.sel = id; S.mdet = window.innerWidth <= 1240; render(); return;
    case "back": S.mdet = false; render(); return;
    case "open": S.drawer = id; render(); return;
    case "dclose": S.drawer = null; render(); return;
    case "st": e.stopPropagation(); setStatus(id, (S.status[id] || "none") === v && v !== "none" ? "none" : v); return;
    case "conf": S.conf[id] = v; persist(); render(); toast(v === "ok" ? "已确认" : "已标记，下次整理会重写", BYID[id].n, [{ l: "撤销", f: () => { delete S.conf[id]; persist(); } }]); return;
    case "codex": { const it = BYID[id]; copy(codexPrompt(it, S.page === "solve" ? S.solve.q : S.fil.q), "已复制，去 Codex 里粘贴", "里面写好了它是什么、怎么试、先读 README"); return; }
    case "copyhow": copy(cleanHow(BYID[id]), "已复制"); return;
    case "tf": S.todayFilter = v; S.sel = null; render(); return;
    case "fsc": S.fil.sc = S.fil.sc === v ? null : v; S.sel = null; render(); return;
    case "fst": S.fil.st = S.fil.st === v ? null : v; S.sel = null; render(); return;
    case "ffm": S.fil.form = S.fil.form === v ? null : v; S.sel = null; render(); return;
    case "clr": S.fil = { sc: null, st: null, form: null, q: "", proc: S.fil.proc }; S.sel = null; render(); return;
    case "fproc": S.fil.proc = v; S.sel = null; render(); return;
    case "solve": S.solve.q = $("#solveq").value; runSolve(); render(); return;
    case "ex": S.solve.q = t.dataset.q; runSolve(); render(); return;
    case "pk": S.solve.picked.has(id) ? S.solve.picked.delete(id) : S.solve.picked.add(id); render(); return;
    case "fmt": S.solve.fmt = v; render(); return;
    case "copypack": copy(packText(), "参考包已复制", "去 Codex 里粘贴就能用"); return;
    case "savepack": toast("正式版会弹出选择文件夹的窗口", "原型里不演示"); return;
    case "gotodisc": { const sc0 = v || t.dataset.sc; S.page = "discover"; S.disc = { tab: "rec", sc: ["ec","seo","xhs","wx","dy"].includes(sc0) ? sc0 : "ec" }; render(); return; }
    case "dsc": S.disc.sc = v; render(); return;
    case "dtab": S.disc.tab = v; render(); return;
    case "capadd": {
      const text = S.cap.text.trim(), h = String(text.length) + ":" + text.slice(0, 40) + text.slice(-40);
      if (S.cap.batches.has(h)) { toast("这段已经收过，没有重复写入"); return; }
      const rows = extract(text).map(L => ({ L, st: capStatus(L) })), fresh = rows.filter(r => r.st === "new");
      S.cap.batches.add(h); fresh.forEach(r => S.cap.inbox.unshift({ norm: r.L.norm, kind: r.L.kind, label: r.L.kind === "repo" ? r.L.owner + "/" + r.L.name : r.L.norm.replace(/^https?:\/\//, ""), src: S.cap.src }));
      const n = k => rows.filter(r => r.st === k).length;
      render(); toast(`新收 ${fresh.length} 条`, [n("starred") ? `${n("starred")} 条已在你的 Stars 里` : "", n("blocked") ? `${n("blocked")} 条是内网地址，已拦下` : ""].filter(Boolean).join("，")); return;
    }
    case "capc": { const c = DATA.cand.find(x => x.n === t.dataset.n) || DATA.ranks.find(x => x.n === t.dataset.n); toast("已收进收集箱", (c ? c.n : t.dataset.n) + " · 会自动整理出中文说明"); return; }
    case "cmdk": S.cmdk = { open: true, q: "", idx: 0 }; render(); return;
    case "cmdkgo": { const r = cmdkResults()[+t.dataset.i]; S.cmdk.open = false; if (r.t === "repo") { S.page = "lib"; S.fil = { sc: null, st: null, form: null, q: "", proc: "all" }; S.sel = r.it.id; } else if (r.t === "page") S.page = r.k; else { S.page = "solve"; S.solve.q = r.q || S.solve.q; runSolve(); } render(); return; }
    case "sync": if (!S.syncing) { S.syncing = true; render(); setTimeout(() => { S.syncing = false; render(); toast("同步完成", "没有新的收藏"); }, 1200); } return;
    case "theme": S.theme = v; persist(); render(); return;
    case "reset": S.status = {}; S.conf = {}; S.cap.inbox = []; S.cap.batches = new Set(); persist(); render(); toast("示例已重置"); return;
    case "toast": toast(t.dataset.t); return;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "libq") { S.fil.q = t.value; S.sel = null; const res = libList(); S.sel = res[0] ? res[0].id : null; render(); }
  else if (t.id === "capta") { S.cap.text = t.value; $("#cappre").innerHTML = capPreviewHTML(); icons(); }
  else if (t.id === "capnote") S.cap.note = t.value;
  else if (t.id === "cmdkq") { S.cmdk.q = t.value; S.cmdk.idx = 0; render(); }
});
document.addEventListener("change", e => { if (e.target.id === "capsrc") S.cap.src = e.target.value; });
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.cmdk = { open: !S.cmdk.open, q: "", idx: 0 }; render(); return; }
  if (S.cmdk.open) {
    if (e.key === "Escape") { S.cmdk.open = false; render(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); S.cmdk.idx++; render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); S.cmdk.idx = Math.max(0, S.cmdk.idx - 1); render(); }
    else if (e.key === "Enter") { const b = $(".cmdk .ci.on"); if (b) b.click(); }
    return;
  }
  if (e.key === "Escape" && S.about) { S.about = false; render(); return; }
  if (e.key === "Escape") { if (S.drawer) { S.drawer = null; render(); } else if (S.mdet) { S.mdet = false; render(); } return; }
  if (typing || !DETAIL_PAGES.includes(S.page)) { if (e.key === "Enter" && document.activeElement.id === "solveq") $(`[data-act="solve"]`).click(); return; }
  const k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (k === "t" && S.sel) setStatus(S.sel, "want");
  else if (k === "u" && S.sel) setStatus(S.sel, "use");
  else if (k === "x" && S.sel) setStatus(S.sel, "drop");
  else if (k === "c" && S.sel) $(`[data-act="codex"]`) && $(`[data-act="codex"]`).click();
  else if (e.key === "/" && S.page === "lib") { e.preventDefault(); const el = $("#libq"); el && el.focus(); }
});
render();
</script>
